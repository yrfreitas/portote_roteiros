<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Portotec — Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">

  <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border);
      background: linear-gradient(160deg, var(--glass-fill), var(--glass-fill-2));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      padding: 34px 30px;
    }
    .login-titulo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .login-erro {
      background: var(--danger-dim);
      border: 1px solid rgba(248,113,113,0.28);
      color: var(--danger-text);
      border-radius: var(--radius);
      padding: 10px 13px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .login-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-weight: 700;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-titulo">Portotec — Roteiros</div>
    <div class="login-sub">Entre com o seu usuário e senha.</div>

    {% if erro %}
    <div class="login-erro">{{ erro }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <label class="login-label" for="usuario">Usuário</label>
      <input class="form-input" type="text" id="usuario" name="usuario" autofocus
             autocomplete="username" autocapitalize="none" spellcheck="false"
             style="margin-bottom:14px;">

      <label class="login-label" for="senha">Senha</label>
      <input class="form-input" type="password" id="senha" name="senha" required
             autocomplete="current-password" style="margin-bottom:18px;">
      <button class="btn btn-primary btn-full" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
