<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acompanhe seu atendimento · Porto Tec</title>
  <link rel="icon" href="/static/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0c0f12; color: #e8edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header { padding: 14px 16px; border-bottom: 1px solid #1e252d; }
    .marca { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: #6f7d8c; }
    h1 { font-size: 17px; margin: 4px 0 0; font-weight: 700; }
    #mapa { flex: 1; min-height: 320px; background: #11161b; }
    .painel { padding: 14px 16px 20px; border-top: 1px solid #1e252d; }
    .estado {
      display: flex; align-items: center; gap: 9px;
      font-size: 14px; font-weight: 600; margin-bottom: 6px;
    }
    .bolinha { width: 10px; height: 10px; border-radius: 50%; background: #2aa05c; flex: none; }
    .bolinha.pulsa { animation: pulsa 1.6s ease-in-out infinite; }
    .bolinha.parado { background: #8b97a3; animation: none; }
    @keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .detalhe { font-size: 12.5px; color: #94a1ae; line-height: 1.6; }
    .aviso {
      margin-top: 10px; padding: 10px 12px; border-radius: 8px;
      background: rgba(42,160,92,.12); border: 1px solid rgba(42,160,92,.3);
      font-size: 12.5px; line-height: 1.55;
    }
    .aviso.encerrado { background: rgba(139,151,163,.12); border-color: rgba(139,151,163,.3); }
    /* Cartão do técnico: quem espera em casa quer saber quem vai chegar.
       Fica ACIMA do mapa de propósito — é a primeira coisa que o cliente lê. */
    .tec-cartao {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid #1e252d;
      background: #10151a;
    }
    .tec-cartao:empty { display: none; }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
      flex: none; border: 2px solid #2a333d;
    }
    .avatar.sem-foto {
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 19px; border-color: transparent;
    }
    .tec-nome { font-size: 15px; font-weight: 700; }
    .tec-papel { font-size: 11.5px; color: #7f8d9b; margin-top: 2px; }


    /* ─── Chat flutuante ────────────────────────────────────────────
       Bolinha no canto direito. O cliente nao tem conta e nao vai criar uma
       para perguntar "que horas ele chega?" -- o link dele JA e a credencial,
       entao a conversa vive dentro da propria pagina de acompanhamento. */
    .chat-bolha {
      position: fixed; right: 16px; bottom: 16px; z-index: 900;
      width: 56px; height: 56px; border-radius: 50%;
      background: #1a6fd4; color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.45);
      transition: transform .15s ease;
    }
    .chat-bolha:hover { transform: scale(1.06); }
    .chat-bolha .badge-chat {
      position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px;
      border-radius: 99px; background: #e04c4c; color: #fff;
      font-size: 11px; font-weight: 700; display: none;
      align-items: center; justify-content: center; padding: 0 5px;
    }
    .chat-bolha .badge-chat.tem { display: flex; }

    .chat-janela {
      position: fixed; right: 16px; bottom: 82px; z-index: 900;
      width: min(340px, calc(100vw - 32px)); max-height: min(460px, 70vh);
      display: none; flex-direction: column;
      background: #10161c; border: 1px solid #1e252d; border-radius: 14px;
      box-shadow: 0 10px 34px rgba(0,0,0,.55); overflow: hidden;
    }
    .chat-janela.aberto { display: flex; }
    .chat-topo {
      padding: 12px 14px; border-bottom: 1px solid #1e252d;
      font-size: 13px; font-weight: 700;
    }
    .chat-topo small { display: block; font-weight: 400; font-size: 11px; color: #7f8d9b; margin-top: 2px; }
    .chat-corpo { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
    .msg .hora { display: block; font-size: 10px; opacity: .6; margin-top: 3px; }
    .msg.deles { align-self: flex-start; background: #1b2530; border-bottom-left-radius: 4px; }
    .msg.minha { align-self: flex-end; background: #1a6fd4; border-bottom-right-radius: 4px; }
    .msg.sistema { align-self: center; background: rgba(42,160,92,.14); color: #9fe3ba; font-size: 12px; text-align: center; }
    .chat-envio { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #1e252d; }
    .chat-envio input {
      flex: 1; background: #0c1116; border: 1px solid #1e252d; border-radius: 9px;
      color: #e8edf3; padding: 9px 11px; font-size: 13px; font-family: inherit;
    }
    .chat-envio button {
      background: #1a6fd4; color: #fff; border: none; border-radius: 9px;
      padding: 0 14px; cursor: pointer; font-weight: 600;
    }

    /* Leaflet injeta estilo inline nos tiles; sem isso o mapa fica claro
       demais ao lado do resto da página. */
    .leaflet-tile { filter: brightness(.85) saturate(.9); }
  </style>
</head>
<body>
  <header>
    <div class="marca">Porto Tec Assistência Técnica</div>
    <h1 id="titulo">Acompanhe seu atendimento</h1>
  </header>

  <div class="tec-cartao" id="cabecalho-tecnico"></div>

  <div id="mapa"></div>

  <div class="painel">
    <div class="estado">
      <span class="bolinha pulsa" id="bolinha"></span>
      <span id="estado-txt">Carregando...</span>
    </div>
    <div class="detalhe" id="detalhe"></div>
    <div id="caixa-aviso"></div>
  </div>


  <button class="chat-bolha" id="chat-bolha" aria-label="Falar com a Porto Tec">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span class="badge-chat" id="chat-badge"></span>
  </button>

  <div class="chat-janela" id="chat-janela" role="dialog" aria-label="Conversa com a Porto Tec">
    <div class="chat-topo">Falar com a Porto Tec
      <small>Dúvida sobre o atendimento? Escreva aqui.</small>
    </div>
    <div class="chat-corpo" id="chat-corpo"></div>
    <form class="chat-envio" id="chat-form">
      <input id="chat-texto" placeholder="Escreva sua mensagem..." autocomplete="off" maxlength="1000">
      <button type="submit" aria-label="Enviar">↑</button>
    </form>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script>
    (function () {
      const TOKEN = {{ token | tojson }};
      // Dois ritmos. Com o tecnico se movendo no mapa, 20s acompanha o
      // carrinho de perto. Sem posicao ao vivo so ha a previsao, que muda com
      // o relogio: 60s basta e poupa bateria e dados de quem esta esperando.
      const INTERVALO_AO_VIVO = 20000;
      const INTERVALO_PREVISAO = 60000;

      let mapa = null;
      // Guardada fora do desenho porque desenharTecnico() roda a cada ciclo e
      // a foto vem uma vez só, junto com o resto da resposta.
      let fotoTecnico = null;
      let marcadorTecnico = null;
      let circuloPrecisao = null;
      let linhaRota = null;
      let jaEnquadrou = false;

      function iniciarMapa(centro) {
        // setView junto com a criacao: adicionar camada antes de haver visao
        // definida quebra o Leaflet com "undefined (reading 'intersects')".
        mapa = L.map('mapa', { attributionControl: false }).setView(centro, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(mapa);
      }

      function hora(txtUtc) {
        if (!txtUtc) return null;
        // O servidor grava "AAAA-MM-DD HH:MM:SS" em UTC. O Z e o T explicitos
        // fazem o navegador converter para o fuso de quem esta olhando; sem
        // eles, o iPhone interpreta como hora local e mostra 3h a menos.
        const d = new Date(String(txtUtc).replace(' ', 'T') + 'Z');
        return isNaN(d) ? null : d;
      }

      function formatar(d) {
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }

      // Cartão com a cara e o nome de quem vai chegar, acima do mapa.
      function mostrarCabecalhoTecnico(d) {
        const alvo = document.getElementById('cabecalho-tecnico');
        if (!alvo || alvo.dataset.pronto === '1') return;

        const cor = d.tecnico_cor || '#1a6fd4';
        const inicial = (d.tecnico || '?').trim().charAt(0).toUpperCase();
        const avatar = d.tecnico_foto
          ? `<img src="${d.tecnico_foto}" alt="" class="avatar">`
          : `<div class="avatar sem-foto" style="background:${cor}">${inicial}</div>`;

        alvo.innerHTML = `${avatar}
          <div>
            <div class="tec-nome">${d.tecnico || 'Técnico'}</div>
            <div class="tec-papel">Técnico da Porto Tec a caminho</div>
          </div>`;
        alvo.dataset.pronto = '1';   // não redesenha a cada ciclo
      }

      function haQuantoTempo(seg) {
        if (seg == null) return '';
        if (seg < 60) return 'agora mesmo';
        const min = Math.round(seg / 60);
        if (min < 60) return `ha ${min} min`;
        return `ha ${Math.round(min / 60)} h`;
      }

      // Desenha (ou move) o carrinho do tecnico e o tracejado ate a casa.
      // Pino cinza e opaco quando a posicao envelheceu: o cliente precisa
      // enxergar a diferenca entre "esta aqui" e "foi visto aqui ha 8 min",
      // senao interpreta carro parado como tecnico que nao saiu do lugar.
      function desenharTecnico(pos, destino) {
        if (!mapa || !pos) return;
        const aoVivo = pos.ao_vivo;
        const cor = aoVivo ? '#1a6fd4' : '#8b95a3';
        const ponto = [pos.lat, pos.lng];

        // Com foto, o pino É o rosto do técnico — mesma ideia do aplicativo de
        // corrida: quem espera em casa quer saber QUEM vai bater na porta.
        // Sem foto, volta ao carrinho. O anel colorido mantém a leitura de
        // "ao vivo" (cor) x "posição antiga" (cinza) nos dois casos.
        const miolo = fotoTecnico
          ? `<img src="${fotoTecnico}" alt="" style="width:100%;height:100%;
               border-radius:50%;object-fit:cover;display:block;">`
          : '<span style="font-size:16px;line-height:1">🚗</span>';

        const icone = L.divIcon({
          className: '',
          html: `<div style="width:42px;height:42px;border-radius:50%;background:${cor};
                 border:3px solid ${cor};box-shadow:0 2px 10px rgba(0,0,0,.45);
                 display:flex;align-items:center;justify-content:center;overflow:hidden;
                 opacity:${aoVivo ? 1 : .72};">${miolo}</div>`,
          iconSize: [42, 42], iconAnchor: [21, 21],
        });

        const rotulo = aoVivo ? 'Tecnico agora' : `Visto ${haQuantoTempo(pos.idade_seg)}`;

        if (marcadorTecnico) {
          marcadorTecnico.setLatLng(ponto);
          marcadorTecnico.setIcon(icone);
          marcadorTecnico.setTooltipContent(rotulo);
        } else {
          marcadorTecnico = L.marker(ponto, { icon: icone })
            .addTo(mapa).bindTooltip(rotulo, { direction: 'top' });
        }

        // Circulo de incerteza. Um ponto seco no mapa afirma uma precisao que
        // o aparelho nao tem: com 300m de erro, o tecnico pode estar em
        // qualquer lugar dentro do circulo. Desenhar isso e mais honesto e
        // evita o cliente concluir "ele esta na rua de tras" quando nao esta.
        // Abaixo de 60m nao desenha: circulo minusculo so polui a tela.
        const raio = pos.precisao || 0;
        if (raio > 60) {
          if (circuloPrecisao) {
            circuloPrecisao.setLatLng(ponto);
            circuloPrecisao.setRadius(raio);
            circuloPrecisao.setStyle({ color: cor, fillColor: cor });
          } else {
            circuloPrecisao = L.circle(ponto, {
              radius: raio, color: cor, fillColor: cor,
              fillOpacity: .12, weight: 1, opacity: .4,
            }).addTo(mapa);
          }
        } else if (circuloPrecisao) {
          mapa.removeLayer(circuloPrecisao);
          circuloPrecisao = null;
        }

        // Linha reta e nao rota de rua: o servidor nao calcula trajeto, e
        // fingir um caminho que o tecnico nao vai fazer engana mais do que
        // ajuda. A reta comunica direcao e distancia, que e o que importa.
        const temDestino = destino && destino.lat != null && destino.lng != null;
        if (temDestino) {
          const traco = [ponto, [destino.lat, destino.lng]];
          if (linhaRota) linhaRota.setLatLngs(traco);
          else linhaRota = L.polyline(traco, {
            color: cor, weight: 3, opacity: .6, dashArray: '8 8',
          }).addTo(mapa);
          linhaRota.setStyle({ color: cor });

          // Enquadra os dois UMA vez. Reenquadrar a cada 20s tiraria o mapa do
          // lugar toda hora, justo quando o cliente esta tentando olhar.
          if (!jaEnquadrou) {
            mapa.fitBounds(L.latLngBounds(traco).pad(0.35));
            jaEnquadrou = true;
          }
        }
      }

      async function atualizar() {
        let d;
        try {
          const resp = await fetch(`/api/rastreio/${TOKEN}`, { cache: 'no-store' });
          d = await resp.json();
          if (!resp.ok) throw new Error(d.erro || 'Nao foi possivel carregar');
        } catch (e) {
          document.getElementById('estado-txt').textContent = 'Sem conexao';
          document.getElementById('bolinha').className = 'bolinha parado';
          return false;
        }

        const destino = d.destino || {};
        const temDestino = destino.lat != null && destino.lng != null;

        // Tudo que toca o Leaflet (iniciarMapa/marcadores/desenharTecnico) fica
        // protegido por try/catch daqui pra frente. Antes, se o script do mapa
        // nao tivesse carregado -- rede ruim, bloqueio no aparelho do cliente,
        // CDN fora -- o erro derrubava a funcao INTEIRA sem cair em catch
        // nenhum: o ciclo() nunca chegava no proximo setTimeout, a tela ficava
        // travada pra sempre com o mapa preto (o fundo escuro do <div id=mapa>
        // sem tile nenhum em cima), e so a bolinha verde continuava piscando
        // (ela e CSS puro, roda mesmo com o JS travado) -- exatamente a dupla
        // "tela preta + piscando" que os clientes reportaram em 2026-08-25.
        // Isolar aqui garante que o texto de estado/previsao (que nao depende
        // do Leaflet) sempre atualiza, com ou sem mapa.

        // O mapa nasce no destino quando ele existe; se o CEP nao foi
        // geocodificado, nasce na posicao do tecnico. Antes, sem destino nao
        // havia mapa nenhum — e o cliente ficava sem ver nada, mesmo com o
        // tecnico reportando posicao.
        try {
          if (!mapa && !temDestino && d.posicao) {
            iniciarMapa([d.posicao.lat, d.posicao.lng]);
            jaEnquadrou = true;  // sem destino nao ha o que enquadrar junto
          }

          if (!mapa && temDestino) {
            iniciarMapa([destino.lat, destino.lng]);
            L.marker([destino.lat, destino.lng], {
              icon: L.divIcon({
                className: '',
                html: `<div style="width:32px;height:32px;border-radius:50%;background:#e02020;
                       border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;
                       align-items:center;justify-content:center;font-size:15px;">🏠</div>`,
                iconSize: [32, 32], iconAnchor: [16, 16],
              }),
            }).addTo(mapa).bindTooltip('Seu endereco', { direction: 'top' });
          }
        } catch (e) {
          console.warn('Mapa indisponivel:', e);
        }

        const estadoTxt = document.getElementById('estado-txt');
        const bolinha = document.getElementById('bolinha');
        const detalhe = document.getElementById('detalhe');
        const caixa = document.getElementById('caixa-aviso');

        if (d.chegou) {
          estadoTxt.textContent = 'Atendimento concluido';
          bolinha.className = 'bolinha parado';
          detalhe.textContent = `${d.tecnico} ja finalizou este atendimento.`;
          caixa.innerHTML = '<div class="aviso encerrado">Obrigado por acompanhar.</div>';
          return true;
        }

        if (!d.ativo) {
          estadoTxt.textContent = 'Acompanhamento encerrado';
          bolinha.className = 'bolinha parado';
          detalhe.textContent = 'Este link nao esta mais ativo.';
          caixa.innerHTML = '<div class="aviso encerrado">Se ainda estiver aguardando, fale com a Porto Tec.</div>';
          return true;
        }

        fotoTecnico = d.tecnico_foto || null;
        mostrarCabecalhoTecnico(d);

        const pos = d.posicao;
        if (pos) {
          try { desenharTecnico(pos, destino); }
          catch (e) { console.warn('Mapa indisponivel:', e); }
        }

        estadoTxt.textContent = pos && pos.ao_vivo
          ? `${d.tecnico} esta a caminho`
          : `${d.tecnico} saiu para o atendimento`;
        bolinha.className = 'bolinha pulsa';

        const saiu = hora(d.saiu_em);
        const chega = hora(d.chegada_prevista);

        if (chega) {
          const faltam = Math.round((chega - new Date()) / 60000);
          // Previsao vencida nao vira numero negativo: passa a "a qualquer
          // momento", que e honesto e nao assusta quem esta esperando.
          const restante = faltam > 0
            ? `Chega em cerca de ${faltam} min`
            : 'Deve chegar a qualquer momento';
          caixa.innerHTML = `<div class="aviso"><strong>${restante}</strong><br>
            Previsao: ${formatar(chega)}${saiu ? ' · saiu as ' + formatar(saiu) : ''}</div>`;
        } else if (saiu) {
          caixa.innerHTML = `<div class="aviso"><strong>Saiu as ${formatar(saiu)}</strong></div>`;
        }

        // A idade da posicao entra no texto de baixo, nao no titulo: quem
        // espera quer primeiro o "quando chega", e depois o "onde esta".
        const ondeEsta = pos
          ? (pos.ao_vivo ? ' · no mapa em tempo real'
                         : ` · ultima posicao ${haQuantoTempo(pos.idade_seg)}`)
          : '';
        detalhe.textContent =
          (destino.endereco ? `Indo ate ${destino.endereco}` : '') + ondeEsta;

        // Devolve o ritmo: so acelera para 20s quando ha de fato carrinho
        // andando no mapa. Sem isso o celular do cliente faria 3x mais
        // requisicoes para ver um numero de previsao que nem mudou.
        return pos && pos.ao_vivo ? 'aovivo' : false;
      }


      // ─── Chat com a Porto Tec ─────────────────────────────────────
      // A SALA e o proprio token do link: quem tem o link fala nesta conversa
      // e em nenhuma outra. Isso da identidade, escopo e validade de graca --
      // um chat generico teria que construir os tres.
      //
      // Polling e nao websocket: o servidor roda com 1 worker e 8 threads, e
      // cada conexao aberta prenderia uma thread. Oito clientes com o chat
      // aberto travariam a aplicacao. 8s e o meio termo entre parecer vivo e
      // nao torrar dados de quem esta no celular.
      // Set dos ids ja desenhados: duas buscas concorrentes (o ciclo de 8s
      // e a disparada logo apos enviar) liam o mesmo chatUltimoId antes de
      // qualquer uma atualizar, e as duas desenhavam a MESMA mensagem.
      const chatVistos = new Set();
      let chatOcupado = false;
      let chatUltimoId = 0;
      let chatAberto = false;
      let chatNaoLidas = 0;

      function chatHora(txt) {
        const d = hora(txt);
        return d ? formatar(d) : '';
      }

      function chatDesenhar(msgs) {
        const corpo = document.getElementById('chat-corpo');
        msgs.forEach(m => {
          if (chatVistos.has(m.id)) return;
          chatVistos.add(m.id);
          const div = document.createElement('div');
          const tipo = m.autor_tipo === 'cliente' ? 'minha'
                     : (m.autor_tipo === 'sistema' ? 'sistema' : 'deles');
          div.className = 'msg ' + tipo;
          const nome = (tipo === 'deles' && m.autor_nome) ? `<b>${m.autor_nome}</b><br>` : '';
          div.innerHTML = `${nome}${String(m.texto).replace(/[<>&]/g, c => (
            { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}
            <span class="hora">${chatHora(m.criado_em)}</span>`;
          corpo.appendChild(div);
          chatUltimoId = Math.max(chatUltimoId, m.id);

          // So conta como nao lida o que veio DELES com a janela fechada.
          if (!chatAberto && tipo !== 'minha') chatNaoLidas++;
        });
        if (msgs.length) corpo.scrollTop = corpo.scrollHeight;

        const badge = document.getElementById('chat-badge');
        badge.textContent = chatNaoLidas;
        badge.classList.toggle('tem', chatNaoLidas > 0);
      }

      async function chatBuscar() {
        if (chatOcupado) return;
        chatOcupado = true;
        try {
          const r = await fetch(`/api/chat/${TOKEN}?desde=${chatUltimoId}`, { cache: 'no-store' });
          if (!r.ok) return;
          const d = await r.json();
          if (d.mensagens && d.mensagens.length) chatDesenhar(d.mensagens);
        } catch { /* sem sinal: tenta no proximo ciclo */ }
        finally { chatOcupado = false; }
      }

      document.getElementById('chat-bolha').addEventListener('click', () => {
        chatAberto = !chatAberto;
        document.getElementById('chat-janela').classList.toggle('aberto', chatAberto);
        if (chatAberto) {
          chatNaoLidas = 0;
          document.getElementById('chat-badge').classList.remove('tem');
          document.getElementById('chat-texto').focus();
          document.getElementById('chat-corpo').scrollTop = 1e6;
        }
      });

      document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const campo = document.getElementById('chat-texto');
        const texto = campo.value.trim();
        if (!texto) return;
        campo.value = '';
        try {
          await fetch(`/api/chat/${TOKEN}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto }),
          });
          chatBuscar();
        } catch {
          // Devolve o texto: perder a mensagem sem avisar seria pior.
          campo.value = texto;
          alert('Sem conexao agora. Tente de novo em instantes.');
        }
      });

      chatBuscar();
      setInterval(chatBuscar, 8000);

      async function ciclo() {
        // Rede de seguranca de ultima instancia: qualquer excecao nao prevista
        // dentro de atualizar() para de propagar aqui, e o ciclo continua
        // tentando de novo em vez de morrer pra sempre (o que deixaria a tela
        // parada com o ultimo estado exibido, indefinidamente).
        let r = false;
        try {
          r = await atualizar();
        } catch (e) {
          console.warn('Falha no ciclo de atualizacao:', e);
        }
        if (r === true) return;  // acabou: chegou ou link encerrado
        setTimeout(ciclo, r === 'aovivo' ? INTERVALO_AO_VIVO : INTERVALO_PREVISAO);
      }
      ciclo();
    })();
  </script>
</body>
</html>
