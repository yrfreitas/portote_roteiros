<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central de Comando · Porto Tec</title>
  <link rel="icon" href="/static/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --accent: #4f8dfb; --accent-2: #22d3ee; --accent-text: #7db2ff;
      --verde: #34d399; --verde-texto: #86efac;
      --ambar: #f5b544; --vermelho: #f87171;
      --bg: #05070d; --painel: rgba(13,18,30,.62); --borda: rgba(148,178,220,.14);
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #eaf0fb; font-family: var(--sans); overflow: hidden; }

    /* ─── Fundo: grade de radar + vinheta ─────────────────────────── */
    body {
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,141,251,.10), transparent 60%),
        linear-gradient(rgba(79,141,251,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,141,251,.055) 1px, transparent 1px);
      background-size: auto, 36px 36px, 36px 36px;
    }

    .app { height: 100%; display: flex; flex-direction: column; }

    /* ─── Cabeçalho ────────────────────────────────────────────────── */
    header {
      flex: none; padding: 14px 26px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--borda); position: relative; overflow: hidden;
      background: linear-gradient(180deg, rgba(10,14,24,.55), transparent);
    }
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-text), var(--accent-2), transparent);
      opacity: .7;
    }
    /* Varredura de radar cruzando o cabeçalho de vez em quando — puro
       enfeite "central de comando", roda em loop bem lento pra não distrair. */
    .varredura {
      position: absolute; top: 0; bottom: 0; width: 140px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(79,141,251,.12), transparent);
      animation: varrer 7s linear infinite;
    }
    @keyframes varrer { from { left: -140px; } to { left: 110%; } }

    .marca-bloco { display: flex; align-items: center; gap: 14px; }
    .logo-selo {
      width: 40px; height: 40px; border-radius: 11px; flex: none;
      background: linear-gradient(145deg, var(--accent), #2563eb);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display, var(--sans)); font-weight: 800; font-size: 17px; color: #fff;
      box-shadow: 0 0 22px rgba(79,141,251,.45), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .marca { font-size: 10.5px; letter-spacing: 2.2px; text-transform: uppercase; color: #5a6d8a; font-family: var(--mono); }
    h1 { font-size: 19px; margin: 3px 0 0; font-weight: 800; letter-spacing: .2px; }

    .header-direita { display: flex; align-items: center; gap: 14px; }
    .relogio { font-family: var(--mono); font-size: 20px; font-weight: 700; color: #d5deeb; letter-spacing: 1px; }
    .relogio small { display: block; font-size: 9.5px; font-weight: 600; color: #5a6d8a; letter-spacing: 1.5px; text-align: right; margin-top: 1px; }
    .ao-vivo-selo {
      font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
      background: rgba(52,211,153,.14); color: var(--verde-texto); border-radius: 99px;
      padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(52,211,153,.32); font-family: var(--mono);
    }
    .ao-vivo-selo::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--verde); animation: pulsa 1.6s ease-in-out infinite; box-shadow: 0 0 8px var(--verde); }
    @keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes anelPulso { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes subir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .voltar {
      display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #9aacc6;
      text-decoration: none; font-family: var(--mono); padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--borda); transition: color .15s, border-color .15s;
    }
    .voltar:hover { color: #eaf0fb; border-color: rgba(148,178,220,.35); }

    /* ─── Tiras de KPI ─────────────────────────────────────────────── */
    .kpis {
      flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px;
      padding: 16px 26px 4px;
    }
    .kpi {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 14px;
      padding: 14px 16px; position: relative; overflow: hidden; backdrop-filter: blur(6px);
      animation: subir .4s ease-out backwards;
    }
    .kpi::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cor, var(--accent));
      box-shadow: 0 0 10px var(--cor, var(--accent));
    }
    .kpi-icone { font-size: 15px; opacity: .85; }
    .kpi-valor { font-family: var(--mono); font-size: 28px; font-weight: 800; margin-top: 6px; color: #f2f6ff; }
    .kpi-label { font-size: 10.5px; color: #8fa3bf; text-transform: uppercase; letter-spacing: .8px; margin-top: 2px; }

    /* ─── Corpo: lista+ranking à esquerda, mapa à direita ─────────── */
    .corpo { flex: 1; display: grid; grid-template-columns: 340px 1fr; gap: 14px; padding: 14px 26px 18px; min-height: 0; }

    .painel-lateral {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 16px;
      display: flex; flex-direction: column; min-height: 0; backdrop-filter: blur(6px); overflow: hidden;
    }
    .painel-titulo {
      flex: none; padding: 14px 16px 10px; font-size: 11.5px; font-weight: 700; color: #8fa3bf;
      text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: space-between;
    }
    .lista { flex: 1; overflow-y: auto; padding: 10px; }
    .lista::-webkit-scrollbar { width: 6px; }
    .lista::-webkit-scrollbar-thumb { background: rgba(148,178,220,.2); border-radius: 3px; }

    .tec-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 13px; margin-bottom: 8px;
      cursor: pointer; transition: background .12s, border-color .12s, transform .12s;
      border: 1px solid transparent; position: relative; overflow: visible;
      animation: subir .35s ease-out backwards;
      background: linear-gradient(135deg, rgba(255,255,255,.025), transparent);
    }
    .tec-card:hover { background: rgba(148,178,220,.08); transform: translateX(2px); }
    .tec-card.selecionado { background: rgba(79,141,251,.14); border-color: rgba(79,141,251,.4); }

    /* Avatar: foto de verdade quando existe (mesmo padrão de /acompanhar —
       "o pino É o rosto do técnico"), senão iniciais sobre gradiente na cor
       dele. O aro pulsa em verde só pra quem está em atendimento agora. */
    .tec-avatar-wrap { position: relative; flex: none; }
    .tec-avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block;
      border: 2px solid rgba(255,255,255,.14);
      box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
    .tec-avatar.ao-vivo { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 3px rgba(52,211,153,.14), 0 3px 14px rgba(0,0,0,.45); }
    .tec-avatar-inicial {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 16px; font-family: var(--sans);
      border: 2px solid rgba(255,255,255,.14); box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
    .tec-avatar-inicial.ao-vivo { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 3px rgba(52,211,153,.14), 0 3px 14px rgba(0,0,0,.45); }
    .tec-vivo-dot {
      position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--verde); border: 2px solid #0d1220; box-shadow: 0 0 6px var(--verde);
    }

    /* Selo de posição — substitui o emoji de medalha (pedido de 2026-09-03:
       "esses emotes estão com cara de ia, quero algo mais evoluído"): um
       distintivo com gradiente metálico de verdade só pros 3 primeiros,
       numeral discreto pros demais. */
    .tec-selo {
      position: absolute; left: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; font-weight: 800; color: #2a2110;
      border: 1.5px solid rgba(0,0,0,.25); z-index: 2;
    }
    .tec-selo.p1 { background: linear-gradient(145deg, #fff3b0, #e8b930 55%, #a9781a); box-shadow: 0 0 10px rgba(232,185,48,.55); }
    .tec-selo.p2 { background: linear-gradient(145deg, #f4f7fb, #c2cbd6 55%, #8b95a3); box-shadow: 0 0 8px rgba(194,203,214,.4); }
    .tec-selo.p3 { background: linear-gradient(145deg, #f0b487, #c1723f 55%, #8a4c27); color: #2a1608; box-shadow: 0 0 8px rgba(193,114,63,.4); }
    .tec-selo.pn { background: rgba(148,178,220,.16); color: #9aacc6; border-color: var(--borda); font-size: 9px; }

    .tec-corpo { flex: 1; min-width: 0; }
    .tec-nome-linha { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .tec-nome { font-size: 14px; font-weight: 700; }
    .tec-km { font-size: 11px; color: #7d8ea3; font-family: var(--mono); flex: none; }
    .tec-status { font-size: 11.5px; color: #9aacc6; margin-top: 3px; line-height: 1.45; font-family: var(--mono); }
    .tec-status .destaque { color: var(--verde-texto); font-weight: 600; }
    .vazio { padding: 30px 18px; text-align: center; color: #5a6d8a; font-size: 12.5px; line-height: 1.6; }

    /* Atividade recente — dentro do mesmo painel lateral, embaixo da lista.
       Pedido de 2026-09-04: "quero coisas acontecendo" -- troca o resumo
       estático (só contagens) por um feed de eventos de verdade (quem fez
       o quê, e quando), que é o que dá a sensação de "central viva". */
    .resumo-dia { flex: none; border-top: 1px solid var(--borda); padding: 12px 16px 14px; max-height: 34%; overflow-y: auto; }
    .atividade-item {
      font-size: 12px; color: #c7d2e3; line-height: 1.4; padding: 7px 0 7px 16px; position: relative;
      border-bottom: 1px solid rgba(148,178,220,.06);
    }
    .atividade-item:last-child { border-bottom: none; }
    .atividade-item::before {
      content: ''; position: absolute; left: 1px; top: 13px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent-text); box-shadow: 0 0 6px var(--accent-text);
    }
    .atividade-item.tipo-orcamento_aprovado::before { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
    .atividade-item.tipo-nao_atendido::before { background: var(--vermelho); box-shadow: 0 0 6px var(--vermelho); }
    .atividade-hora { display: block; font-family: var(--mono); font-size: 10px; color: #5a6d8a; margin-top: 2px; }

    /* ─── Mapa ───────────────────────────────────────────────────── */
    main { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--borda); }
    #mapa { position: absolute; inset: 0; background: #0b0f17; }
    /* Mapa escuro sem depender de provedor pago -- CartoDB dark_all passou a
       exigir chave de API (achado em 2026-09-04, "API KEY REQUIRED" escrito
       por cima do mapa inteiro). OpenStreetMap padrão + inversão de cor no
       PAINEL DE TILES INTEIRO (não tile por tile, pra não deixar costura
       entre eles) é o truque de sempre pra virar claro em escuro de verdade:
       bem diferente do filtro antigo (só brightness/saturate/hue-rotate),
       que deixava o mapa CLARO só um pouco mais escuro, não realmente escuro. */
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.7); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a {
      background: rgba(13,18,30,.85) !important; color: #9aacc6 !important;
      border-color: var(--borda) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(79,141,251,.2) !important; color: #fff !important; }

    /* Botão de mapa de calor, sobre o canto do mapa */
    .btn-calor {
      position: absolute; top: 16px; left: 16px; z-index: 500;
      background: rgba(6,9,17,.9); border: 1px solid var(--borda);
      border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #9aacc6;
      backdrop-filter: blur(6px); font-family: var(--mono); cursor: pointer;
      display: flex; align-items: center; gap: 7px; transition: border-color .15s, color .15s;
    }
    .btn-calor:hover { color: #eaf0fb; border-color: rgba(248,113,113,.4); }
    .btn-calor.ativo { color: #fca5a5; border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.1); }

    main::after {
      content: ''; position: absolute; inset: 12px; pointer-events: none; z-index: 500;
      background:
        linear-gradient(var(--accent-text), var(--accent-text)) top left / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top left / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top right / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top right / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom left / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom left / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom right / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom right / 2px 20px no-repeat;
      opacity: .5;
    }
    .sem-permissao {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; text-align: center; padding: 20px; z-index: 600; background: var(--bg);
    }
    .sem-permissao h2 { font-size: 18px; margin: 0; }
    .sem-permissao p { color: #9aacc6; font-size: 13.5px; max-width: 360px; margin: 0; }
    .contador {
      position: absolute; top: 16px; right: 16px; z-index: 500;
      background: rgba(6,9,17,.9); border: 1px solid rgba(79,141,251,.3);
      border-radius: 10px; padding: 9px 16px; font-size: 12px; color: #9aacc6;
      backdrop-filter: blur(6px); font-family: var(--mono);
      box-shadow: 0 0 20px rgba(79,141,251,.12);
    }
    .contador b { color: var(--accent-text); font-size: 14px; }

    @media (max-width: 1400px) {
      .kpis { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 980px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .corpo { grid-template-columns: 1fr; }
      main { min-height: 340px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="varredura"></div>
      <div class="marca-bloco">
        <div class="logo-selo">PT</div>
        <div>
          <div class="marca">Porto Tec Assistência Técnica</div>
          <h1>Central de Comando</h1>
        </div>
      </div>
      <div class="header-direita">
        <span class="ao-vivo-selo">ao vivo</span>
        <div class="relogio" id="relogio">--:--:--<small id="data-extenso"></small></div>
        <a class="voltar" href="/">&larr; Painel</a>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="corpo">
      <div class="painel-lateral">
        <div class="painel-titulo"><span>Técnicos</span><span id="contagem-tecnicos"></span></div>
        <div class="lista" id="lista"></div>
        <div class="resumo-dia">
          <div class="painel-titulo" style="padding:0 0 8px;border:0;">⚡ Atividade recente</div>
          <div id="resumo-lista"><span class="vazio" style="padding:6px 0;">Carregando...</span></div>
        </div>
      </div>
      <main>
        <div id="mapa"></div>
        <button type="button" class="btn-calor" id="btn-calor" title="Mostrar de onde vêm mais chamados (histórico)">🔥 Mapa de calor</button>
        <div class="contador" id="contador" style="display:none;"></div>
        <div class="sem-permissao" id="sem-permissao" style="display:none;">
          <h2>Sem acesso</h2>
          <p id="sem-permissao-msg">Você não tem permissão pra ver a Central de Comando. Peça pra quem administra o sistema liberar em Acessos.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script>
    (function () {
      const INTERVALO = 12000;
      let mapa = null;
      const marcadores = {};   // tecnico_id -> L.marker
      const linhasDestino = {}; // tecnico_id -> L.polyline até o destino
      let selecionadoId = null;
      let jaEnquadrouAlguma = false;
      const valoresAnteriores = {};

      function esc(s) {
        return String(s ?? '').replace(/[<>&"]/g, c => (
          { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      }
      function iniciais(nome) { return (nome || '?').trim().charAt(0).toUpperCase(); }

      // ─── Relógio ao vivo ──────────────────────────────────────────
      function relogio() {
        const el = document.getElementById('relogio');
        const data = document.getElementById('data-extenso');
        function t() {
          const agora = new Date();
          el.firstChild.textContent = agora.toLocaleTimeString('pt-BR');
          data.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' }).toUpperCase();
        }
        t(); setInterval(t, 1000);
      }

      // ─── Números que sobem contando, em vez de só trocar ───────────
      function animarNumero(el, novo, casas = 0) {
        const de = valoresAnteriores[el.id] ?? 0;
        valoresAnteriores[el.id] = novo;
        const duracao = 500, inicio = performance.now();
        function passo(agora) {
          const p = Math.min(1, (agora - inicio) / duracao);
          const v = de + (novo - de) * (1 - Math.pow(1 - p, 3));
          el.textContent = casas ? v.toFixed(casas) : Math.round(v);
          if (p < 1) requestAnimationFrame(passo);
        }
        requestAnimationFrame(passo);
      }

      function iconePara(t) {
        const opacidade = t.ao_vivo ? 1 : .55;
        const cor = esc(t.cor || '#4f8dfb');
        const anel = t.ao_vivo
          ? `<div style="position:absolute;inset:-9px;border-radius:50%;border:2px solid ${cor};opacity:.55;animation:anelPulso 1.8s ease-out infinite;"></div>`
          : '';
        return L.divIcon({
          className: '',
          html: `<div style="position:relative;width:38px;height:38px;">
                 ${anel}
                 <div style="width:38px;height:38px;border-radius:50%;background:${cor};
                   border:3px solid ${t.ao_vivo ? '#fff' : 'rgba(255,255,255,.5)'};
                   box-shadow:0 2px 14px rgba(0,0,0,.55)${t.ao_vivo ? `, 0 0 16px ${cor}` : ''};opacity:${opacidade};
                   display:flex;align-items:center;justify-content:center;
                   color:#fff;font-weight:700;font-size:14px;font-family:inherit;">
                   ${iniciais(t.nome)}</div></div>`,
          iconSize: [38, 38], iconAnchor: [19, 19],
        });
      }

      function iniciarMapa() {
        mapa = L.map('mapa', { attributionControl: false, zoomControl: true }).setView([-23.55, -46.63], 11);
        // CartoDB dark_all (tentativa de 2026-09-04) passou a exigir chave de
        // API -- a política deles mudou, tile vinha com marca d'água "API KEY
        // REQUIRED" por cima do mapa inteiro. Volta pro OpenStreetMap (grátis,
        // sem chave, já liberado na CSP do site) com inversão de cor via CSS
        // (.leaflet-tile-pane), que é o truque padrão pra virar mapa claro em
        // escuro de verdade sem depender de provedor nenhum de pago.
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);
      }

      // ─── Mapa de calor (histórico de onde vêm os chamados) ──────────
      // Pedido de 2026-09-04: "mapa de calor nas regiões". Mesma técnica já
      // usada na aba Peças (círculos translúcidos empilhados, sem lib
      // externa) -- aqui num toggle, pra não brigar visualmente com os
      // pinos dos técnicos ao vivo o tempo todo.
      let _camadaCalor = null;
      let _pontosCalor = null;
      async function alternarMapaCalor() {
        const btn = document.getElementById('btn-calor');
        if (!mapa) return; // mapa ainda não montou (clique bem no primeiro instante)
        if (_camadaCalor) {
          mapa.removeLayer(_camadaCalor);
          _camadaCalor = null;
          btn.classList.remove('ativo');
          return;
        }
        btn.classList.add('ativo');
        btn.textContent = '🔥 Carregando...';
        try {
          if (!_pontosCalor) {
            const r = await fetch('/api/relatorios/mapa-calor', { cache: 'no-store' }).then(r => r.json());
            _pontosCalor = r.pontos || [];
          }
          _camadaCalor = L.layerGroup(_pontosCalor.map(p =>
            L.circleMarker([p.lat, p.lng], { radius: 20, stroke: false, fillColor: '#f87171', fillOpacity: 0.05 })
          )).addTo(mapa);
        } finally {
          btn.textContent = '🔥 Mapa de calor';
        }
      }
      document.getElementById('btn-calor').addEventListener('click', alternarMapaCalor);

      function atualizarMarcador(t) {
        if (!t.lat || !t.lng) {
          if (marcadores[t.tecnico_id]) { mapa.removeLayer(marcadores[t.tecnico_id]); delete marcadores[t.tecnico_id]; }
          if (linhasDestino[t.tecnico_id]) { mapa.removeLayer(linhasDestino[t.tecnico_id]); delete linhasDestino[t.tecnico_id]; }
          return;
        }
        const ponto = [t.lat, t.lng];
        const popup = `<div style="min-width:170px;font-family:inherit;">
            <div style="font-weight:700;margin-bottom:3px;">${esc(t.nome)}</div>
            ${t.cliente ? `<div style="font-size:12px;color:#555;">Indo até ${esc(t.cliente)}</div>` : ''}
            ${t.endereco ? `<div style="font-size:11.5px;color:#777;">${esc(t.endereco)}</div>` : ''}
            ${t.eta_minutos != null ? `<div style="font-size:11.5px;color:#777;margin-top:3px;">ETA ~${t.eta_minutos} min</div>` : ''}
          </div>`;
        if (marcadores[t.tecnico_id]) {
          marcadores[t.tecnico_id].setLatLng(ponto).setIcon(iconePara(t)).setPopupContent(popup);
        } else {
          marcadores[t.tecnico_id] = L.marker(ponto, { icon: iconePara(t) }).addTo(mapa).bindPopup(popup);
        }

        // Linha pontilhada até o destino -- os dados (destino_lat/lng) já
        // vinham do servidor desde 2026-09-03 mas nunca tinham sido
        // desenhados; só o pino do técnico aparecia, sem contexto de PRA
        // ONDE ele está indo.
        if (linhasDestino[t.tecnico_id]) mapa.removeLayer(linhasDestino[t.tecnico_id]);
        if (t.destino_lat && t.destino_lng) {
          linhasDestino[t.tecnico_id] = L.polyline([ponto, [t.destino_lat, t.destino_lng]], {
            color: esc(t.cor || '#4f8dfb'), weight: 2, opacity: .55, dashArray: '2,8',
          }).addTo(mapa);
        }
      }

      function statusTexto(t) {
        if (t.ao_vivo) {
          const partes = [];
          if (t.cliente) partes.push(`indo até <b>${esc(t.cliente)}</b>`);
          if (t.eta_minutos != null) partes.push(`ETA ~${t.eta_minutos} min`);
          return `<span class="destaque">${partes.join(' · ') || 'em atendimento'}</span>`;
        }
        return 'sem atendimento rastreado agora';
      }

      // Selo de posição no ranking -- pedido de 2026-09-03 ("tire os
      // emotes, cara de ia") atendido de vez em 2026-09-04: as classes
      // .tec-selo já existiam desde aquela rodada mas nunca tinham sido
      // usadas de fato, o HTML ainda montava o emoji de medalha antigo.
      function seloPosicao(i) {
        if (i === 0) return '<span class="tec-selo p1">1</span>';
        if (i === 1) return '<span class="tec-selo p2">2</span>';
        if (i === 2) return '<span class="tec-selo p3">3</span>';
        return `<span class="tec-selo pn">${i + 1}</span>`;
      }

      function avatarTecnico(t, posicao) {
        const cor = esc(t.cor || '#4f8dfb');
        const vivo = t.ao_vivo ? ' ao-vivo' : '';
        const foto = t.tem_foto
          ? `<img class="tec-avatar${vivo}" src="/api/tecnicos/${t.tecnico_id}/foto" alt="${esc(t.nome)}">`
          : `<div class="tec-avatar-inicial${vivo}" style="background:linear-gradient(145deg, ${cor}, #0d1220);">${iniciais(t.nome)}</div>`;
        return `
          <div class="tec-avatar-wrap">
            ${foto}
            ${t.ao_vivo ? '<span class="tec-vivo-dot"></span>' : ''}
            ${seloPosicao(posicao)}
          </div>`;
      }

      function renderizarLista(tecnicos, kmPorTecnico) {
        const alvo = document.getElementById('lista');
        document.getElementById('contagem-tecnicos').textContent = tecnicos.length ? `${tecnicos.length} cadastrados` : '';
        if (!tecnicos.length) {
          alvo.innerHTML = '<div class="vazio">Nenhum técnico cadastrado.</div>';
          return;
        }
        // Ordena por km rodado hoje (maior primeiro) — mesma ideia do ranking
        // que existia no Painel de TV separado, agora junto com o status ao
        // vivo de cada um, num cartão só em vez de duas telas.
        const ordenados = [...tecnicos].sort((a, b) => (kmPorTecnico[b.tecnico_id] || 0) - (kmPorTecnico[a.tecnico_id] || 0));

        alvo.innerHTML = ordenados.map((t, i) => `
          <div class="tec-card ${t.tecnico_id === selecionadoId ? 'selecionado' : ''} ${t.ao_vivo ? 'ao-vivo' : ''}"
               data-id="${t.tecnico_id}" style="animation-delay:${i * 35}ms;">
            ${avatarTecnico(t, i)}
            <div class="tec-corpo">
              <div class="tec-nome-linha">
                <span class="tec-nome">${esc(t.nome)}</span>
                ${kmPorTecnico[t.tecnico_id] ? `<span class="tec-km">${kmPorTecnico[t.tecnico_id].toFixed(1)} km</span>` : ''}
              </div>
              <div class="tec-status">${statusTexto(t)}</div>
            </div>
          </div>`).join('');

        alvo.querySelectorAll('.tec-card').forEach(el => {
          el.addEventListener('click', () => {
            selecionadoId = Number(el.dataset.id);
            renderizarLista(tecnicos, kmPorTecnico);
            const m = marcadores[selecionadoId];
            if (m) { mapa.setView(m.getLatLng(), 15); m.openPopup(); }
          });
        });
      }

      function iconeKpi(cor, valorId, label, icone) {
        return `<div class="kpi" style="--cor:${cor};">
          <div class="kpi-icone">${icone}</div>
          <div class="kpi-valor" id="${valorId}">0</div>
          <div class="kpi-label">${label}</div>
        </div>`;
      }

      document.getElementById('kpis').innerHTML = [
        iconeKpi('#4f8dfb', 'kpi-tecnicos', 'Técnicos', '👷'),
        iconeKpi('#22d3ee', 'kpi-rotas', 'Rotas ativas', '🗺️'),
        iconeKpi('#34d399', 'kpi-pontos', 'Atendimentos hoje', '📍'),
        iconeKpi('#f5b544', 'kpi-km', 'Km planejados', '🚗'),
        iconeKpi('#a78bfa', 'kpi-fechadas', 'OS fechadas hoje', '✅'),
        // Dois novos (pedido de 2026-09-04: "quero estatísticas") --
        // reaproveitam a mesma contagem que já existia em texto no resumo
        // do dia, só que como número em destaque em vez de frase corrida.
        iconeKpi('#f87171', 'kpi-parados', 'Orçamentos parados', '⏳'),
        iconeKpi('#fb923c', 'kpi-peca', 'Aguardando peça', '🔧'),
      ].join('');

      async function atualizarKpisEResumo() {
        try {
          const [fichas, resumo] = await Promise.all([
            fetch('/api/fichas', { cache: 'no-store' }).then(r => r.json()),
            fetch('/api/relatorios/resumo-dia', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ numeros: {} })),
          ]);
          const ativas = fichas.filter(f => f.status !== 'concluida');
          const kmPorTecnico = {};
          let totalPontos = 0, totalKm = 0;
          ativas.forEach(f => {
            totalPontos += f.total_servicos || 0;
            totalKm += f.distancia_total || 0;
            kmPorTecnico[f.tecnico_id] = (kmPorTecnico[f.tecnico_id] || 0) + (f.distancia_total || 0);
          });
          animarNumero(document.getElementById('kpi-rotas'), ativas.length);
          animarNumero(document.getElementById('kpi-pontos'), totalPontos);
          animarNumero(document.getElementById('kpi-km'), totalKm, 1);

          // Números crus do backend agora (ver routes/relatorios.py:resumo_dia)
          // -- antes vinha um regex caçando "OS fechada" dentro do texto da
          // frase, que quebraria se a frase mudasse uma palavra.
          const n = resumo.numeros || {};
          animarNumero(document.getElementById('kpi-fechadas'), n.fechadas || 0);
          animarNumero(document.getElementById('kpi-parados'), n.orcamentos_parados || 0);
          animarNumero(document.getElementById('kpi-peca'), n.precisa_peca || 0);

          return kmPorTecnico;
        } catch (e) {
          console.warn('KPIs/resumo:', e.message);
          return {};
        }
      }

      // ─── Atividade recente (feed de eventos) ────────────────────────
      async function atualizarAtividade() {
        const alvo = document.getElementById('resumo-lista');
        try {
          const r = await fetch('/api/relatorios/atividade-recente', { cache: 'no-store' }).then(r => r.json());
          const eventos = r.eventos || [];
          alvo.innerHTML = eventos.length
            ? eventos.map(e => `
                <div class="atividade-item tipo-${esc(e.tipo)}">
                  ${esc(e.texto)}
                  <span class="atividade-hora">${_horaCurta(e.quando)}</span>
                </div>`).join('')
            : '<span class="vazio" style="padding:6px 0;">Nada aconteceu ainda hoje.</span>';
        } catch (e) {
          console.warn('Atividade recente:', e.message);
        }
      }
      function _horaCurta(quando) {
        if (!quando) return '';
        // "2026-09-04 14:32:10" -> "14:32". Sem Date() de propósito: o valor
        // já vem em UTC do servidor e converter certo exigiria saber o fuso
        // de quem está olhando -- pra um feed de "há pouco" a hora crua já
        // basta, sem arriscar mostrar hora errada.
        const m = String(quando).match(/(\d{2}):(\d{2})/);
        return m ? `${m[1]}:${m[2]}` : '';
      }

      async function atualizar() {
        const kmPorTecnico = await atualizarKpisEResumo();
        atualizarAtividade();

        let d;
        try {
          const resp = await fetch('/api/torre-controle', { cache: 'no-store' });
          if (resp.status === 403) {
            document.getElementById('sem-permissao').style.display = 'flex';
            return;
          }
          d = await resp.json();
          if (!resp.ok) throw new Error(d.erro || 'Falha ao carregar');
        } catch (e) {
          console.warn('Central de comando:', e.message);
          return;
        }

        const tecnicos = d.tecnicos || [];
        animarNumero(document.getElementById('kpi-tecnicos'), tecnicos.length);
        renderizarLista(tecnicos, kmPorTecnico);

        if (!mapa) iniciarMapa();
        tecnicos.forEach(atualizarMarcador);

        const comPosicao = tecnicos.filter(t => t.lat && t.lng);
        const contador = document.getElementById('contador');
        contador.style.display = 'block';
        contador.innerHTML = `<b>${comPosicao.length}</b> de ${tecnicos.length} técnico${tecnicos.length === 1 ? '' : 's'} ao vivo`;

        if (!jaEnquadrouAlguma && comPosicao.length) {
          const pontos = comPosicao.map(t => [t.lat, t.lng]);
          if (pontos.length === 1) mapa.setView(pontos[0], 14);
          else mapa.fitBounds(pontos, { padding: [60, 60] });
          jaEnquadrouAlguma = true;
        }
      }

      relogio();
      atualizar();
      setInterval(atualizar, INTERVALO);
    })();
  </script>
</body>
</html>
