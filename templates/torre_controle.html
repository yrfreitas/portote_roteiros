<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central de Comando · Porto Tec</title>
  <link rel="icon" href="/static/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --accent: #4f8dfb; --accent-2: #22d3ee; --accent-text: #7db2ff;
      --verde: #34d399; --verde-texto: #86efac;
      --ambar: #f5b544; --vermelho: #f87171;
      --bg: #05070d; --painel: rgba(13,18,30,.62); --borda: rgba(148,178,220,.14);
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #eaf0fb; font-family: var(--sans); overflow: hidden; }

    /* ─── Fundo: grade de radar + vinheta ─────────────────────────── */
    body {
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,141,251,.10), transparent 60%),
        linear-gradient(rgba(79,141,251,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,141,251,.055) 1px, transparent 1px);
      background-size: auto, 36px 36px, 36px 36px;
    }

    .app { height: 100%; display: flex; flex-direction: column; }

    /* ─── Cabeçalho ────────────────────────────────────────────────── */
    header {
      flex: none; padding: 14px 26px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--borda); position: relative; overflow: hidden;
      background: linear-gradient(180deg, rgba(10,14,24,.55), transparent);
    }
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-text), var(--accent-2), transparent);
      opacity: .7;
    }
    /* Varredura de radar cruzando o cabeçalho de vez em quando — puro
       enfeite "central de comando", roda em loop bem lento pra não distrair. */
    .varredura {
      position: absolute; top: 0; bottom: 0; width: 140px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(79,141,251,.12), transparent);
      animation: varrer 7s linear infinite;
    }
    @keyframes varrer { from { left: -140px; } to { left: 110%; } }

    .marca-bloco { display: flex; align-items: center; gap: 14px; }
    /* Logo de verdade em vez do selo "PT" -- pedido de 2026-09-04. Fundo
       branco arredondado porque static/logo.png é colorida/com fundo
       transparente e sumia no fundo escuro sem um contraste por trás. */
    .logo-selo {
      width: 40px; height: 40px; border-radius: 11px; flex: none;
      background: #fff; padding: 5px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 22px rgba(79,141,251,.35), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .logo-selo img { width: 100%; height: 100%; object-fit: contain; }
    .marca { font-size: 10.5px; letter-spacing: 2.2px; text-transform: uppercase; color: #5a6d8a; font-family: var(--mono); }
    h1 { font-size: 19px; margin: 3px 0 0; font-weight: 800; letter-spacing: .2px; }

    .header-direita { display: flex; align-items: center; gap: 14px; }
    .relogio { font-family: var(--mono); font-size: 20px; font-weight: 700; color: #d5deeb; letter-spacing: 1px; }
    .relogio small { display: block; font-size: 9.5px; font-weight: 600; color: #5a6d8a; letter-spacing: 1.5px; text-align: right; margin-top: 1px; }
    .ao-vivo-selo {
      font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
      background: rgba(52,211,153,.14); color: var(--verde-texto); border-radius: 99px;
      padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(52,211,153,.32); font-family: var(--mono);
    }
    .ao-vivo-selo::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--verde); animation: pulsa 1.6s ease-in-out infinite; box-shadow: 0 0 8px var(--verde); }
    @keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes anelPulso { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes subir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .voltar {
      display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #9aacc6;
      text-decoration: none; font-family: var(--mono); padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--borda); transition: color .15s, border-color .15s;
    }
    .voltar:hover { color: #eaf0fb; border-color: rgba(148,178,220,.35); }

    /* ─── Tiras de KPI ─────────────────────────────────────────────── */
    .kpis {
      flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px;
      padding: 16px 26px 4px;
    }
    .kpi {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 14px;
      padding: 14px 16px; position: relative; overflow: hidden; backdrop-filter: blur(6px);
      animation: subir .4s ease-out backwards;
    }
    .kpi::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cor, var(--accent));
      box-shadow: 0 0 10px var(--cor, var(--accent));
    }
    .kpi-icone { width: 20px; height: 20px; opacity: .9; color: var(--cor, var(--accent)); }
    .kpi-icone svg { width: 100%; height: 100%; display: block; }
    .kpi-valor { font-family: var(--mono); font-size: 28px; font-weight: 800; margin-top: 6px; color: #f2f6ff; }
    .kpi-label { font-size: 10.5px; color: #8fa3bf; text-transform: uppercase; letter-spacing: .8px; margin-top: 2px; }

    /* ─── Corpo: lista+ranking à esquerda, mapa à direita ─────────── */
    .corpo { flex: 1; display: grid; grid-template-columns: 340px 1fr; gap: 14px; padding: 14px 26px 18px; min-height: 0; }

    .painel-lateral {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 16px;
      display: flex; flex-direction: column; min-height: 0; backdrop-filter: blur(6px); overflow: hidden;
    }
    .painel-titulo {
      flex: none; padding: 14px 16px 10px; font-size: 11.5px; font-weight: 700; color: #8fa3bf;
      text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: space-between;
    }
    .lista { flex: 1; overflow-y: auto; padding: 10px; }
    .lista::-webkit-scrollbar { width: 6px; }
    .lista::-webkit-scrollbar-thumb { background: rgba(148,178,220,.2); border-radius: 3px; }

    .tec-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 13px; margin-bottom: 8px;
      cursor: pointer; transition: background .12s, border-color .12s, transform .12s;
      border: 1px solid transparent; position: relative; overflow: visible;
      animation: subir .35s ease-out backwards;
      background: linear-gradient(135deg, rgba(255,255,255,.025), transparent);
    }
    .tec-card:hover { background: rgba(148,178,220,.08); transform: translateX(2px); }
    .tec-card.selecionado { background: rgba(79,141,251,.14); border-color: rgba(79,141,251,.4); }

    /* Avatar: foto de verdade quando existe (mesmo padrão de /acompanhar —
       "o pino É o rosto do técnico"), senão iniciais sobre gradiente na cor
       dele. O aro pulsa em verde só pra quem está em atendimento agora. */
    .tec-avatar-wrap { position: relative; flex: none; }
    .tec-avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block;
      border: 2px solid rgba(255,255,255,.14);
      box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
    .tec-avatar.ao-vivo { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 3px rgba(52,211,153,.14), 0 3px 14px rgba(0,0,0,.45); }
    .tec-avatar-inicial {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 16px; font-family: var(--sans);
      border: 2px solid rgba(255,255,255,.14); box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
    .tec-avatar-inicial.ao-vivo { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 3px rgba(52,211,153,.14), 0 3px 14px rgba(0,0,0,.45); }
    .tec-vivo-dot {
      position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--verde); border: 2px solid #0d1220; box-shadow: 0 0 6px var(--verde);
    }

    /* Selo de posição — substitui o emoji de medalha (pedido de 2026-09-03:
       "esses emotes estão com cara de ia, quero algo mais evoluído"): um
       distintivo com gradiente metálico de verdade só pros 3 primeiros,
       numeral discreto pros demais. */
    .tec-selo {
      position: absolute; left: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; font-weight: 800; color: #2a2110;
      border: 1.5px solid rgba(0,0,0,.25); z-index: 2;
    }
    .tec-selo.p1 { background: linear-gradient(145deg, #fff3b0, #e8b930 55%, #a9781a); box-shadow: 0 0 10px rgba(232,185,48,.55); }
    .tec-selo.p2 { background: linear-gradient(145deg, #f4f7fb, #c2cbd6 55%, #8b95a3); box-shadow: 0 0 8px rgba(194,203,214,.4); }
    .tec-selo.p3 { background: linear-gradient(145deg, #f0b487, #c1723f 55%, #8a4c27); color: #2a1608; box-shadow: 0 0 8px rgba(193,114,63,.4); }
    .tec-selo.pn { background: rgba(148,178,220,.16); color: #9aacc6; border-color: var(--borda); font-size: 9px; }

    .tec-corpo { flex: 1; min-width: 0; }
    .tec-nome-linha { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .tec-nome { font-size: 14px; font-weight: 700; }
    .tec-km { font-size: 11px; color: #7d8ea3; font-family: var(--mono); flex: none; }
    .tec-status { font-size: 11.5px; color: #9aacc6; margin-top: 3px; line-height: 1.45; font-family: var(--mono); }
    .tec-status .destaque { color: var(--verde-texto); font-weight: 600; }
    .vazio { padding: 30px 18px; text-align: center; color: #5a6d8a; font-size: 12.5px; line-height: 1.6; }

    /* Atividade recente — dentro do mesmo painel lateral, embaixo da lista.
       Pedido de 2026-09-04: "quero coisas acontecendo" -- troca o resumo
       estático (só contagens) por um feed de eventos de verdade (quem fez
       o quê, e quando), que é o que dá a sensação de "central viva". */
    .resumo-dia { flex: none; border-top: 1px solid var(--borda); padding: 12px 16px 14px; max-height: 34%; overflow-y: auto; }
    .atividade-item {
      font-size: 12px; color: #c7d2e3; line-height: 1.4; padding: 7px 0 7px 16px; position: relative;
      border-bottom: 1px solid rgba(148,178,220,.06);
    }
    .atividade-item:last-child { border-bottom: none; }
    .atividade-item::before {
      content: ''; position: absolute; left: 1px; top: 13px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent-text); box-shadow: 0 0 6px var(--accent-text);
    }
    .atividade-item.tipo-orcamento_aprovado::before { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
    .atividade-item.tipo-nao_atendido::before { background: var(--vermelho); box-shadow: 0 0 6px var(--vermelho); }
    .atividade-hora { display: block; font-family: var(--mono); font-size: 10px; color: #5a6d8a; margin-top: 2px; }

    /* ─── Mapa ───────────────────────────────────────────────────── */
    main { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--borda); }
    #mapa { position: absolute; inset: 0; background: #0b0f17; }
    /* Mapa escuro sem depender de provedor pago -- CartoDB dark_all passou a
       exigir chave de API (achado em 2026-09-04, "API KEY REQUIRED" escrito
       por cima do mapa inteiro). OpenStreetMap padrão + inversão de cor no
       PAINEL DE TILES INTEIRO (não tile por tile, pra não deixar costura
       entre eles) é o truque de sempre pra virar claro em escuro de verdade:
       bem diferente do filtro antigo (só brightness/saturate/hue-rotate),
       que deixava o mapa CLARO só um pouco mais escuro, não realmente escuro. */
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.7); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a {
      background: rgba(13,18,30,.85) !important; color: #9aacc6 !important;
      border-color: var(--borda) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(79,141,251,.2) !important; color: #fff !important; }

    /* Botão de mapa de calor, sobre o canto do mapa */
    .btn-calor {
      position: absolute; top: 16px; left: 16px; z-index: 500;
      background: rgba(6,9,17,.9); border: 1px solid var(--borda);
      border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #9aacc6;
      backdrop-filter: blur(6px); font-family: var(--mono); cursor: pointer;
      display: flex; align-items: center; gap: 7px; transition: border-color .15s, color .15s;
    }
    .btn-calor:hover { color: #eaf0fb; border-color: rgba(248,113,113,.4); }
    .btn-calor.ativo { color: #fca5a5; border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.1); }

    main::after {
      content: ''; position: absolute; inset: 12px; pointer-events: none; z-index: 500;
      background:
        linear-gradient(var(--accent-text), var(--accent-text)) top left / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top left / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top right / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) top right / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom left / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom left / 2px 20px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom right / 20px 2px no-repeat,
        linear-gradient(var(--accent-text), var(--accent-text)) bottom right / 2px 20px no-repeat;
      opacity: .5;
    }
    .sem-permissao {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; text-align: center; padding: 20px; z-index: 600; background: var(--bg);
    }
    .sem-permissao h2 { font-size: 18px; margin: 0; }
    .sem-permissao p { color: #9aacc6; font-size: 13.5px; max-width: 360px; margin: 0; }
    .contador {
      position: absolute; top: 16px; right: 16px; z-index: 500;
      background: rgba(6,9,17,.9); border: 1px solid rgba(79,141,251,.3);
      border-radius: 10px; padding: 9px 16px; font-size: 12px; color: #9aacc6;
      backdrop-filter: blur(6px); font-family: var(--mono);
      box-shadow: 0 0 20px rgba(79,141,251,.12);
    }
    .contador b { color: var(--accent-text); font-size: 14px; }

    /* ─── Extras de 2026-09-04: seta comparativa, filtro de setor, modo TV,
       alerta de atraso/parado, painel de foco (replay do dia) ──────────── */
    .kpi-seta { font-size: 11px; font-family: var(--mono); margin-left: 6px; }
    .kpi-seta.subiu { color: var(--verde-texto); }
    .kpi-seta.desceu { color: var(--vermelho); }
    .kpi-seta.igual { color: #5a6d8a; }

    .filtro-setor {
      background: rgba(255,255,255,.04); border: 1px solid var(--borda); color: #9aacc6;
      font-size: 10.5px; font-family: var(--mono); border-radius: 7px; padding: 3px 6px;
      max-width: 110px;
    }

    /* Fica ACIMA do .contador (que também mora no canto superior direito),
       sempre -- não só quando os dois aparecem juntos: os dois ficam
       visíveis o tempo todo, então a posição relativa tem que ser fixa,
       não condicional (achado testando: sobrepunham um no outro). */
    .btn-modo-tv {
      position: absolute; top: 16px; right: 16px; z-index: 500;
      background: rgba(6,9,17,.9); border: 1px solid var(--borda);
      border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #9aacc6;
      backdrop-filter: blur(6px); font-family: var(--mono); cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-modo-tv:hover { color: #eaf0fb; border-color: rgba(79,141,251,.4); }
    .btn-modo-tv.ativo { color: var(--accent-text); border-color: rgba(79,141,251,.5); background: rgba(79,141,251,.1); }
    .contador { top: 60px; }

    .tec-card.atrasado { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.06); }
    .tec-alerta { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; font-family: var(--mono); }
    .tec-alerta.atraso { background: rgba(248,113,113,.16); color: #fca5a5; }
    .tec-alerta.parado { background: rgba(245,181,68,.16); color: var(--ambar); }
    .tec-foco-btn {
      flex: none; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--borda);
      background: transparent; color: #7d8ea3; cursor: pointer; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .tec-foco-btn:hover { border-color: var(--accent-text); color: var(--accent-text); }

    /* Painel de foco -- desliza da direita, cobre parte do mapa */
    .painel-foco {
      position: absolute; top: 0; right: -380px; bottom: 0; width: 360px; z-index: 700;
      background: rgba(8,11,20,.96); border-left: 1px solid var(--borda);
      backdrop-filter: blur(10px); transition: right .25s ease-out;
      display: flex; flex-direction: column;
    }
    .painel-foco.aberto { right: 0; }
    .painel-foco-topo {
      flex: none; padding: 16px; border-bottom: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: space-between;
    }
    .painel-foco-fechar { background: none; border: none; color: #7d8ea3; font-size: 18px; cursor: pointer; }
    .painel-foco-corpo { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .foco-atendimento {
      padding: 9px 0; border-bottom: 1px solid rgba(148,178,220,.08); font-size: 12.5px;
    }
    .foco-atendimento b { display: block; font-size: 13px; }
    .foco-atendimento .foco-meta { color: #7d8ea3; font-size: 11px; margin-top: 2px; font-family: var(--mono); }
    .btn-replay {
      width: 100%; margin-top: 4px; padding: 9px; border-radius: 9px; border: 1px solid var(--accent-text);
      background: rgba(79,141,251,.12); color: var(--accent-text); font-family: var(--mono); font-size: 12px;
      cursor: pointer; font-weight: 700;
    }
    .btn-replay:hover { background: rgba(79,141,251,.22); }
    .btn-replay:disabled { opacity: .5; cursor: default; }

    .btn-imprimir {
      background: none; border: none; color: #7d8ea3; cursor: pointer; padding: 0;
      width: 16px; height: 16px;
    }
    .btn-imprimir svg { width: 100%; height: 100%; display: block; }
    .btn-imprimir:hover { color: #eaf0fb; }
    .titulo-com-icone { display: flex; align-items: center; gap: 6px; }
    .titulo-icone { width: 13px; height: 13px; color: var(--accent); flex: none; }
    .titulo-icone svg { width: 100%; height: 100%; display: block; }
    @media print {
      header, .kpis, main, .painel-lateral > .painel-titulo, .lista { display: none !important; }
      body { overflow: visible; background: #fff; color: #000; }
      .resumo-dia { max-height: none; border: none; }
      .atividade-item { color: #000; }
    }

    @media (max-width: 1400px) {
      .kpis { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 980px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .corpo { grid-template-columns: 1fr; }
      main { min-height: 340px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="varredura"></div>
      <div class="marca-bloco">
        <div class="logo-selo"><img src="/static/logo.png" alt="Porto Tec"></div>
        <div>
          <div class="marca">Porto Tec Assistência Técnica</div>
          <h1>Central de Comando</h1>
        </div>
      </div>
      <div class="header-direita">
        <span class="ao-vivo-selo">ao vivo</span>
        <div class="relogio" id="relogio">--:--:--<small id="data-extenso"></small></div>
        <a class="voltar" href="/">&larr; Painel</a>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="corpo">
      <div class="painel-lateral">
        <div class="painel-titulo">
          <span>Técnicos</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <select class="filtro-setor" id="filtro-setor" title="Filtrar por setor">
              <option value="">Todos os setores</option>
            </select>
            <span id="contagem-tecnicos"></span>
          </span>
        </div>
        <div class="lista" id="lista"></div>
        <div class="resumo-dia">
          <div class="painel-titulo" style="padding:0 0 8px;border:0;">
            <span class="titulo-com-icone"><span class="titulo-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>Atividade recente</span>
            <button type="button" class="btn-imprimir" id="btn-imprimir" title="Imprimir/exportar o resumo do dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
          </div>
          <div id="resumo-lista"><span class="vazio" style="padding:6px 0;">Carregando...</span></div>
        </div>
      </div>
      <main>
        <div id="mapa"></div>
        <button type="button" class="btn-calor" id="btn-calor" title="Mostrar de onde vêm mais chamados (histórico)">🔥 Mapa de calor</button>
        <button type="button" class="btn-modo-tv" id="btn-modo-tv" title="Foca automaticamente em cada técnico ao vivo, um de cada vez">📺 Modo TV</button>
        <div class="contador" id="contador" style="display:none;"></div>
        <div class="painel-foco" id="painel-foco">
          <div class="painel-foco-topo">
            <strong id="foco-nome">Técnico</strong>
            <button type="button" class="painel-foco-fechar" id="foco-fechar">✕</button>
          </div>
          <div class="painel-foco-corpo" id="foco-corpo"></div>
        </div>
        <div class="sem-permissao" id="sem-permissao" style="display:none;">
          <h2>Sem acesso</h2>
          <p id="sem-permissao-msg">Você não tem permissão pra ver a Central de Comando. Peça pra quem administra o sistema liberar em Acessos.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script>
    (function () {
      const INTERVALO = 12000;
      let mapa = null;
      const marcadores = {};   // tecnico_id -> L.marker
      const linhasDestino = {}; // tecnico_id -> L.polyline até o destino
      let selecionadoId = null;
      let jaEnquadrouAlguma = false;
      const valoresAnteriores = {};

      function esc(s) {
        return String(s ?? '').replace(/[<>&"]/g, c => (
          { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      }
      function iniciais(nome) { return (nome || '?').trim().charAt(0).toUpperCase(); }

      // Ícones de linha (estilo Feather), não emoji -- mesma razão já
      // documentada em app.js: emoji de sistema é o maior sinal visual de
      // "feito às pressas por IA", e aqui a tela nunca tinha recebido esse
      // tratamento (pedido de 2026-09-04: "continua feio").
      const SVG = {
        pessoa:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        mapa:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>',
        pin:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        carro:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.6-4.8A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.2L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>',
        check:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        ampulheta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12"/><path d="M6 22h12"/><path d="M6 2v3a6 6 0 0 0 6 6 6 6 0 0 0-6 6v3"/><path d="M18 2v3a6 6 0 0 1-6 6 6 6 0 0 1 6 6v3"/></svg>',
        chave:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.42l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.94 7.94l-6.9 6.9a2.12 2.12 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.94-7.94z"/></svg>',
        raio:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
        impressora:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
      };

      // ─── Relógio ao vivo ──────────────────────────────────────────
      function relogio() {
        const el = document.getElementById('relogio');
        const data = document.getElementById('data-extenso');
        function t() {
          const agora = new Date();
          el.firstChild.textContent = agora.toLocaleTimeString('pt-BR');
          data.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' }).toUpperCase();
        }
        t(); setInterval(t, 1000);
      }

      // ─── Números que sobem contando, em vez de só trocar ───────────
      function animarNumero(el, novo, casas = 0) {
        const de = valoresAnteriores[el.id] ?? 0;
        valoresAnteriores[el.id] = novo;
        const duracao = 500, inicio = performance.now();
        function passo(agora) {
          const p = Math.min(1, (agora - inicio) / duracao);
          const v = de + (novo - de) * (1 - Math.pow(1 - p, 3));
          el.textContent = casas ? v.toFixed(casas) : Math.round(v);
          if (p < 1) requestAnimationFrame(passo);
        }
        requestAnimationFrame(passo);
      }

      // Ícone do aparelho no pino, em vez de só a inicial -- pedido de
      // 2026-09-04: dá contexto de o que está sendo atendido sem precisar
      // clicar no pino pra abrir o popup.
      const ICONE_APARELHO = [
        [['geladeira', 'refrigerador', 'freezer'], '🧊'],
        [['ar condicionado', 'ar-condicionado', 'split', 'climatizador'], '❄️'],
        [['lava e seca', 'lavadora', 'máquina de lavar', 'maquina de lavar', 'tanquinho'], '🌀'],
        [['micro-ondas', 'microondas', 'micro ondas'], '📡'],
        [['lava-louça', 'lava louça', 'lava loucas'], '🍽️'],
        [['fogão', 'fogao', 'cooktop'], '🔥'],
      ];
      function iconeAparelho(tipoAparelho) {
        const alvo = (tipoAparelho || '').toLowerCase();
        const grupo = ICONE_APARELHO.find(([chaves]) => chaves.some(c => alvo.includes(c)));
        return grupo ? grupo[1] : null;
      }

      function iconePara(t) {
        const opacidade = t.ao_vivo ? 1 : .55;
        const cor = esc(t.cor || '#4f8dfb');
        // Atrasado (pedido de 2026-09-04): já passou da chegada prevista e
        // ainda está a caminho -- anel vermelho pulsando MAIS rápido que o
        // "ao vivo" normal, pra chamar atenção sem precisar abrir a lista.
        const corAnel = t.atrasado ? '#f87171' : cor;
        const duracaoAnel = t.atrasado ? '.9s' : '1.8s';
        const anel = t.ao_vivo
          ? `<div style="position:absolute;inset:-9px;border-radius:50%;border:2px solid ${corAnel};opacity:.55;animation:anelPulso ${duracaoAnel} ease-out infinite;"></div>`
          : '';
        const emoji = iconeAparelho(t.tipo_aparelho);
        const conteudo = emoji
          ? `<span style="font-size:16px;">${emoji}</span>`
          : iniciais(t.nome);
        return L.divIcon({
          className: '',
          html: `<div style="position:relative;width:38px;height:38px;">
                 ${anel}
                 <div style="width:38px;height:38px;border-radius:50%;background:${cor};
                   border:3px solid ${t.atrasado ? '#f87171' : (t.ao_vivo ? '#fff' : 'rgba(255,255,255,.5)')};
                   box-shadow:0 2px 14px rgba(0,0,0,.55)${t.ao_vivo ? `, 0 0 16px ${corAnel}` : ''};opacity:${opacidade};
                   display:flex;align-items:center;justify-content:center;
                   color:#fff;font-weight:700;font-size:14px;font-family:inherit;">
                   ${conteudo}</div></div>`,
          iconSize: [38, 38], iconAnchor: [19, 19],
        });
      }

      function iniciarMapa() {
        mapa = L.map('mapa', { attributionControl: false, zoomControl: true }).setView([-23.55, -46.63], 11);
        // CartoDB dark_all (tentativa de 2026-09-04) passou a exigir chave de
        // API -- a política deles mudou, tile vinha com marca d'água "API KEY
        // REQUIRED" por cima do mapa inteiro. Volta pro OpenStreetMap (grátis,
        // sem chave, já liberado na CSP do site) com inversão de cor via CSS
        // (.leaflet-tile-pane), que é o truque padrão pra virar mapa claro em
        // escuro de verdade sem depender de provedor nenhum de pago.
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);
      }

      // ─── Mapa de calor (histórico de onde vêm os chamados) ──────────
      // Pedido de 2026-09-04: "mapa de calor nas regiões". Mesma técnica já
      // usada na aba Peças (círculos translúcidos empilhados, sem lib
      // externa) -- aqui num toggle, pra não brigar visualmente com os
      // pinos dos técnicos ao vivo o tempo todo.
      let _camadaCalor = null;
      let _pontosCalor = null;
      async function alternarMapaCalor() {
        const btn = document.getElementById('btn-calor');
        if (!mapa) return; // mapa ainda não montou (clique bem no primeiro instante)
        if (_camadaCalor) {
          mapa.removeLayer(_camadaCalor);
          _camadaCalor = null;
          btn.classList.remove('ativo');
          return;
        }
        btn.classList.add('ativo');
        btn.textContent = '🔥 Carregando...';
        try {
          if (!_pontosCalor) {
            const r = await fetch('/api/relatorios/mapa-calor', { cache: 'no-store' }).then(r => r.json());
            _pontosCalor = r.pontos || [];
          }
          _camadaCalor = L.layerGroup(_pontosCalor.map(p =>
            L.circleMarker([p.lat, p.lng], { radius: 20, stroke: false, fillColor: '#f87171', fillOpacity: 0.05 })
          )).addTo(mapa);
        } finally {
          btn.textContent = '🔥 Mapa de calor';
        }
      }
      document.getElementById('btn-calor').addEventListener('click', alternarMapaCalor);

      function atualizarMarcador(t) {
        if (!t.lat || !t.lng) {
          if (marcadores[t.tecnico_id]) { mapa.removeLayer(marcadores[t.tecnico_id]); delete marcadores[t.tecnico_id]; }
          if (linhasDestino[t.tecnico_id]) { mapa.removeLayer(linhasDestino[t.tecnico_id]); delete linhasDestino[t.tecnico_id]; }
          return;
        }
        const ponto = [t.lat, t.lng];
        const emoji = iconeAparelho(t.tipo_aparelho);
        const popup = `<div style="min-width:170px;font-family:inherit;">
            <div style="font-weight:700;margin-bottom:3px;">${esc(t.nome)}</div>
            ${t.cliente ? `<div style="font-size:12px;color:#555;">Indo até ${esc(t.cliente)}</div>` : ''}
            ${t.endereco ? `<div style="font-size:11.5px;color:#777;">${esc(t.endereco)}</div>` : ''}
            ${emoji || t.tipo_aparelho ? `<div style="font-size:11.5px;color:#777;">${emoji || ''} ${esc(t.tipo_aparelho || '')}</div>` : ''}
            ${t.eta_minutos != null ? `<div style="font-size:11.5px;color:#777;margin-top:3px;">ETA ~${t.eta_minutos} min</div>` : ''}
            ${t.atrasado ? `<div style="font-size:11.5px;color:#c0392b;font-weight:700;margin-top:3px;">⚠ atrasado</div>` : ''}
            ${t.parado_ha_muito && !t.atrasado ? `<div style="font-size:11.5px;color:#a06a10;font-weight:700;margin-top:3px;">⏸ parado há um tempo</div>` : ''}
          </div>`;
        if (marcadores[t.tecnico_id]) {
          marcadores[t.tecnico_id].setLatLng(ponto).setIcon(iconePara(t)).setPopupContent(popup);
        } else {
          marcadores[t.tecnico_id] = L.marker(ponto, { icon: iconePara(t) }).addTo(mapa).bindPopup(popup);
        }

        atualizarLinhaDestino(t, ponto);
      }

      // Trajeto até o destino pela RUA de verdade, não a reta -- pedido de
      // 2026-09-04: "quero o trajeto certinho que ele tem que fazer, em
      // vez de só uma reta pontilhada" (a reta cortava rio, quadra e prédio
      // que nenhum carro atravessa). Cache por técnico: só busca de novo no
      // OSRM se ele andou o bastante (~150m) ou trocou de destino -- sem
      // isso martelaria a mesma consulta a cada 12s à toa.
      const _rotaRealCache = {};
      async function atualizarLinhaDestino(t, ponto) {
        if (!t.destino_lat || !t.destino_lng) {
          if (linhasDestino[t.tecnico_id]) { mapa.removeLayer(linhasDestino[t.tecnico_id]); delete linhasDestino[t.tecnico_id]; }
          delete _rotaRealCache[t.tecnico_id];
          return;
        }
        const cache = _rotaRealCache[t.tecnico_id];
        const mudouMuito = !cache
          || Math.abs(cache.lat - t.lat) > 0.0013 || Math.abs(cache.lng - t.lng) > 0.0013
          || cache.destino_lat !== t.destino_lat || cache.destino_lng !== t.destino_lng;
        if (!mudouMuito) return;
        _rotaRealCache[t.tecnico_id] = { lat: t.lat, lng: t.lng, destino_lat: t.destino_lat, destino_lng: t.destino_lng };

        let pontos = [];
        try {
          const r = await fetch(`/api/tecnicos/${t.tecnico_id}/rota-ate-destino`, { cache: 'no-store' }).then(r => r.json());
          pontos = r.pontos || [];
        } catch (e) {
          console.warn('Falha ao buscar trajeto real:', e.message);
        }

        if (linhasDestino[t.tecnico_id]) mapa.removeLayer(linhasDestino[t.tecnico_id]);
        if (pontos.length >= 2) {
          linhasDestino[t.tecnico_id] = L.polyline(pontos, {
            color: esc(t.cor || '#4f8dfb'), weight: 3, opacity: .65,
          }).addTo(mapa);
        } else {
          // OSRM não respondeu -- reta pontilhada como rede de segurança,
          // mas mais apagada, pra não passar a impressão de ser o trajeto real.
          linhasDestino[t.tecnico_id] = L.polyline([ponto, [t.destino_lat, t.destino_lng]], {
            color: esc(t.cor || '#4f8dfb'), weight: 2, opacity: .35, dashArray: '2,8',
          }).addTo(mapa);
        }
      }

      function statusTexto(t) {
        if (t.ao_vivo) {
          const partes = [];
          if (t.cliente) partes.push(`indo até <b>${esc(t.cliente)}</b>`);
          if (t.eta_minutos != null) partes.push(`ETA ~${t.eta_minutos} min`);
          return `<span class="destaque">${partes.join(' · ') || 'em atendimento'}</span>`;
        }
        return 'sem atendimento rastreado agora';
      }

      // Selo de posição no ranking -- pedido de 2026-09-03 ("tire os
      // emotes, cara de ia") atendido de vez em 2026-09-04: as classes
      // .tec-selo já existiam desde aquela rodada mas nunca tinham sido
      // usadas de fato, o HTML ainda montava o emoji de medalha antigo.
      function seloPosicao(i) {
        if (i === 0) return '<span class="tec-selo p1">1</span>';
        if (i === 1) return '<span class="tec-selo p2">2</span>';
        if (i === 2) return '<span class="tec-selo p3">3</span>';
        return `<span class="tec-selo pn">${i + 1}</span>`;
      }

      // Se a foto falhar (arquivo apagado, id sem foto cadastrada mas
      // tem_foto desatualizado etc.), o navegador mostra o alt TEXT no
      // lugar da imagem quebrada -- nome inteiro espremido/vazando pra fora
      // do círculo de 38px, achado em 2026-09-04 (Igor e Pedro apareciam
      // assim). Cai pro mesmo avatar de iniciais que quem não tem foto já usa.
      function _avatarErro(img) {
        const div = document.createElement('div');
        div.className = 'tec-avatar-inicial' + (img.dataset.vivo === '1' ? ' ao-vivo' : '');
        div.style.background = `linear-gradient(145deg, ${img.dataset.cor}, #0d1220)`;
        div.textContent = iniciais(img.dataset.nome);
        img.replaceWith(div);
      }
      // O onerror="" inline resolve no escopo GLOBAL, mas esta função vive
      // dentro da IIFE da página -- sem isto, toda foto quebrada gerava
      // "_avatarErro is not defined" no console e o alt-text continuava
      // vazando (achado ao testar o próprio fix em produção).
      window._avatarErro = _avatarErro;

      function avatarTecnico(t, posicao) {
        const cor = esc(t.cor || '#4f8dfb');
        const vivo = t.ao_vivo ? ' ao-vivo' : '';
        const foto = t.tem_foto
          ? `<img class="tec-avatar${vivo}" src="/api/tecnicos/${t.tecnico_id}/foto" alt="${esc(t.nome)}"
               data-nome="${esc(t.nome)}" data-cor="${cor}" data-vivo="${t.ao_vivo ? '1' : '0'}"
               onerror="_avatarErro(this)">`
          : `<div class="tec-avatar-inicial${vivo}" style="background:linear-gradient(145deg, ${cor}, #0d1220);">${iniciais(t.nome)}</div>`;
        return `
          <div class="tec-avatar-wrap">
            ${foto}
            ${t.ao_vivo ? '<span class="tec-vivo-dot"></span>' : ''}
            ${seloPosicao(posicao)}
          </div>`;
      }

      // Guarda o último resultado pra reaplicar o filtro de setor sem
      // esperar o próximo /api/torre-controle (troca de setor é instantânea).
      let _ultimosTecnicos = [];
      let _ultimoKm = {};
      let _setorAtivo = '';

      function popularFiltroSetor(tecnicos) {
        const sel = document.getElementById('filtro-setor');
        const atual = sel.value;
        const setores = [...new Map(
          tecnicos.filter(t => t.setor_id).map(t => [t.setor_id, t.setor_nome])
        ).entries()];
        sel.innerHTML = '<option value="">Todos os setores</option>'
          + setores.map(([id, nome]) => `<option value="${id}">${esc(nome)}</option>`).join('');
        sel.value = setores.some(([id]) => String(id) === atual) ? atual : '';
      }

      function renderizarLista(tecnicos, kmPorTecnico) {
        _ultimosTecnicos = tecnicos;
        _ultimoKm = kmPorTecnico;
        popularFiltroSetor(tecnicos);

        const filtrados = _setorAtivo
          ? tecnicos.filter(t => String(t.setor_id) === _setorAtivo)
          : tecnicos;

        const alvo = document.getElementById('lista');
        document.getElementById('contagem-tecnicos').textContent = tecnicos.length ? `${tecnicos.length} cadastrados` : '';
        if (!filtrados.length) {
          alvo.innerHTML = `<div class="vazio">${tecnicos.length ? 'Nenhum técnico nesse setor agora.' : 'Nenhum técnico cadastrado.'}</div>`;
          return;
        }
        // Ordena por km rodado hoje (maior primeiro) — mesma ideia do ranking
        // que existia no Painel de TV separado, agora junto com o status ao
        // vivo de cada um, num cartão só em vez de duas telas.
        const ordenados = [...filtrados].sort((a, b) => (kmPorTecnico[b.tecnico_id] || 0) - (kmPorTecnico[a.tecnico_id] || 0));

        alvo.innerHTML = ordenados.map((t, i) => `
          <div class="tec-card ${t.tecnico_id === selecionadoId ? 'selecionado' : ''} ${t.ao_vivo ? 'ao-vivo' : ''} ${t.atrasado ? 'atrasado' : ''}"
               data-id="${t.tecnico_id}" style="animation-delay:${i * 35}ms;">
            ${avatarTecnico(t, i)}
            <div class="tec-corpo">
              <div class="tec-nome-linha">
                <span class="tec-nome">${esc(t.nome)}</span>
                ${kmPorTecnico[t.tecnico_id] ? `<span class="tec-km">${kmPorTecnico[t.tecnico_id].toFixed(1)} km</span>` : ''}
              </div>
              <div class="tec-status">
                ${statusTexto(t)}
                ${t.atrasado ? '<span class="tec-alerta atraso">atrasado</span>' : ''}
                ${t.parado_ha_muito && !t.atrasado ? '<span class="tec-alerta parado">parado</span>' : ''}
              </div>
            </div>
            <button type="button" class="tec-foco-btn" data-foco-id="${t.tecnico_id}" title="Ver a rota do dia">📋</button>
          </div>`).join('');

        alvo.querySelectorAll('.tec-card').forEach(el => {
          el.addEventListener('click', (ev) => {
            if (ev.target.closest('.tec-foco-btn')) return; // trata à parte, abaixo
            selecionadoId = Number(el.dataset.id);
            renderizarLista(tecnicos, kmPorTecnico);
            const m = marcadores[selecionadoId];
            if (m) { mapa.setView(m.getLatLng(), 15); m.openPopup(); }
          });
        });
        alvo.querySelectorAll('.tec-foco-btn').forEach(btn => {
          btn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            abrirPainelFoco(Number(btn.dataset.focoId));
          });
        });

        if (window._modoTvAtivo) atualizarAlvosModoTv(filtrados.filter(t => t.ao_vivo));
      }

      function iconeKpi(cor, valorId, label, icone) {
        // kpi-seta é um irmão do valor, não filho -- animarNumero() faz
        // el.textContent = novo a cada ciclo, que apagaria qualquer filho
        // (a setinha) se ela estivesse dentro do mesmo elemento.
        return `<div class="kpi" style="--cor:${cor};">
          <div class="kpi-icone">${icone}</div>
          <div style="display:flex;align-items:baseline;">
            <div class="kpi-valor" id="${valorId}">0</div>
            <span id="${valorId}-seta"></span>
          </div>
          <div class="kpi-label">${label}</div>
        </div>`;
      }

      document.getElementById('kpis').innerHTML = [
        iconeKpi('#4f8dfb', 'kpi-tecnicos', 'Técnicos', SVG.pessoa),
        iconeKpi('#22d3ee', 'kpi-rotas', 'Rotas ativas', SVG.mapa),
        iconeKpi('#34d399', 'kpi-pontos', 'Atendimentos hoje', SVG.pin),
        iconeKpi('#f5b544', 'kpi-km', 'Km planejados', SVG.carro),
        iconeKpi('#a78bfa', 'kpi-fechadas', 'OS fechadas hoje', SVG.check),
        // Dois novos (pedido de 2026-09-04: "quero estatísticas") --
        // reaproveitam a mesma contagem que já existia em texto no resumo
        // do dia, só que como número em destaque em vez de frase corrida.
        iconeKpi('#f87171', 'kpi-parados', 'Orçamentos parados', SVG.ampulheta),
        iconeKpi('#fb923c', 'kpi-peca', 'Aguardando peça', SVG.chave),
      ].join('');

      async function atualizarKpisEResumo() {
        try {
          const [fichas, resumo] = await Promise.all([
            fetch('/api/fichas', { cache: 'no-store' }).then(r => r.json()),
            fetch('/api/relatorios/resumo-dia', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ numeros: {} })),
          ]);
          const ativas = fichas.filter(f => f.status !== 'concluida');
          const kmPorTecnico = {};
          let totalPontos = 0, totalKm = 0;
          ativas.forEach(f => {
            totalPontos += f.total_servicos || 0;
            totalKm += f.distancia_total || 0;
            kmPorTecnico[f.tecnico_id] = (kmPorTecnico[f.tecnico_id] || 0) + (f.distancia_total || 0);
          });
          animarNumero(document.getElementById('kpi-rotas'), ativas.length);
          animarNumero(document.getElementById('kpi-pontos'), totalPontos);
          animarNumero(document.getElementById('kpi-km'), totalKm, 1);

          // Números crus do backend agora (ver routes/relatorios.py:resumo_dia)
          // -- antes vinha um regex caçando "OS fechada" dentro do texto da
          // frase, que quebraria se a frase mudasse uma palavra.
          const n = resumo.numeros || {};
          animarNumero(document.getElementById('kpi-fechadas'), n.fechadas || 0);
          animarNumero(document.getElementById('kpi-parados'), n.orcamentos_parados || 0);
          animarNumero(document.getElementById('kpi-peca'), n.precisa_peca || 0);

          atualizarComparativo(totalPontos);

          return kmPorTecnico;
        } catch (e) {
          console.warn('KPIs/resumo:', e.message);
          return {};
        }
      }

      // ─── Comparativo com ontem (seta nos KPIs) ──────────────────────
      // Pedido de 2026-09-04: "seta pra cima/baixo mostrando se hoje está
      // melhor ou pior". Só busca 1x por carregamento de página (não muda
      // durante o dia de um jeito que valha reconsultar a cada 12s) --
      // guardado em módulo pra não repetir a chamada em todo atualizar().
      let _comparativoCarregado = false;
      function seta(hoje, ontem) {
        if (hoje > ontem) return '<span class="kpi-seta subiu">▲</span>';
        if (hoje < ontem) return '<span class="kpi-seta desceu">▼</span>';
        return '<span class="kpi-seta igual">＝</span>';
      }
      async function atualizarComparativo(totalPontosHoje) {
        if (_comparativoCarregado) return;
        try {
          const r = await fetch('/api/relatorios/comparativo-dia', { cache: 'no-store' }).then(r => r.json());
          _comparativoCarregado = true;
          const elFechadas = document.getElementById('kpi-fechadas-seta');
          const elPontos = document.getElementById('kpi-pontos-seta');
          if (elFechadas && r.fechadas) elFechadas.innerHTML = seta(r.fechadas.hoje, r.fechadas.ontem);
          if (elPontos && r.atendimentos) elPontos.innerHTML = seta(totalPontosHoje, r.atendimentos.ontem);
        } catch (e) {
          console.warn('Comparativo:', e.message);
        }
      }

      // ─── Atividade recente (feed de eventos) ────────────────────────
      let _ultimoEventoVisto = null;
      async function atualizarAtividade() {
        const alvo = document.getElementById('resumo-lista');
        try {
          const r = await fetch('/api/relatorios/atividade-recente', { cache: 'no-store' }).then(r => r.json());
          const eventos = r.eventos || [];

          // Confete quando um orçamento aprovado NOVO aparece (pedido de
          // 2026-09-04) -- "novo" é comparado contra o evento mais recente
          // já visto no carregamento anterior, pra não confetizar de novo
          // toda hora nos mesmos eventos antigos.
          if (eventos.length && _ultimoEventoVisto) {
            const idx = eventos.findIndex(e => e.quando === _ultimoEventoVisto);
            const novos = idx === -1 ? [] : eventos.slice(0, idx);
            if (novos.some(e => e.tipo === 'orcamento_aprovado')) confeteRapido();
          }
          if (eventos.length) _ultimoEventoVisto = eventos[0].quando;

          alvo.innerHTML = eventos.length
            ? eventos.map(e => `
                <div class="atividade-item tipo-${esc(e.tipo)}">
                  ${esc(e.texto)}
                  <span class="atividade-hora">${_horaCurta(e.quando)}</span>
                </div>`).join('')
            : '<span class="vazio" style="padding:6px 0;">Nada aconteceu ainda hoje.</span>';
        } catch (e) {
          console.warn('Atividade recente:', e.message);
        }
      }

      // Confete em canvas puro, sem lib -- mesma técnica do painel principal
      // (app.js:_confeteRapido), reescrita aqui porque esta página é
      // standalone (não carrega app.js). Desliga com prefers-reduced-motion.
      function confeteRapido() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;';
        canvas.width = innerWidth; canvas.height = innerHeight;
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const cores = ['#4f8dfb', '#22d3ee', '#34d399', '#f5b544', '#f87171'];
        const pecas = Array.from({ length: 90 }, () => ({
          x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * .3,
          vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3.5,
          rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
          tam: 5 + Math.random() * 5, cor: cores[Math.floor(Math.random() * cores.length)],
        }));
        const inicio = performance.now();
        (function passo(agora) {
          const t = agora - inicio;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pecas.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.rot += p.vr;
            ctx.save();
            ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.fillStyle = p.cor;
            ctx.fillRect(-p.tam / 2, -p.tam / 2, p.tam, p.tam * .6);
            ctx.restore();
          });
          if (t < 3200) requestAnimationFrame(passo); else canvas.remove();
        })(inicio);
      }
      function _horaCurta(quando) {
        if (!quando) return '';
        // "2026-09-04 14:32:10" -> "14:32". Sem Date() de propósito: o valor
        // já vem em UTC do servidor e converter certo exigiria saber o fuso
        // de quem está olhando -- pra um feed de "há pouco" a hora crua já
        // basta, sem arriscar mostrar hora errada.
        const m = String(quando).match(/(\d{2}):(\d{2})/);
        return m ? `${m[1]}:${m[2]}` : '';
      }

      async function atualizar() {
        const kmPorTecnico = await atualizarKpisEResumo();
        atualizarAtividade();

        let d;
        try {
          const resp = await fetch('/api/torre-controle', { cache: 'no-store' });
          if (resp.status === 403) {
            document.getElementById('sem-permissao').style.display = 'flex';
            return;
          }
          d = await resp.json();
          if (!resp.ok) throw new Error(d.erro || 'Falha ao carregar');
        } catch (e) {
          console.warn('Central de comando:', e.message);
          return;
        }

        const tecnicos = d.tecnicos || [];
        animarNumero(document.getElementById('kpi-tecnicos'), tecnicos.length);
        renderizarLista(tecnicos, kmPorTecnico);

        if (!mapa) iniciarMapa();
        tecnicos.forEach(atualizarMarcador);

        const comPosicao = tecnicos.filter(t => t.lat && t.lng);
        const contador = document.getElementById('contador');
        contador.style.display = 'block';
        contador.innerHTML = `<b>${comPosicao.length}</b> de ${tecnicos.length} técnico${tecnicos.length === 1 ? '' : 's'} ao vivo`;

        if (!jaEnquadrouAlguma && comPosicao.length) {
          const pontos = comPosicao.map(t => [t.lat, t.lng]);
          if (pontos.length === 1) mapa.setView(pontos[0], 14);
          else mapa.fitBounds(pontos, { padding: [60, 60] });
          jaEnquadrouAlguma = true;
        }
      }

      // ─── Filtro por setor ────────────────────────────────────────────
      document.getElementById('filtro-setor').addEventListener('change', (ev) => {
        _setorAtivo = ev.target.value;
        renderizarLista(_ultimosTecnicos, _ultimoKm);
      });

      // ─── Imprimir/exportar o resumo do dia ─────────────────────────
      // Pedido de 2026-09-04: "exportar o resumo do dia". Sem gerar PDF de
      // verdade (exigiria lib nova) -- @media print já deixado no CSS
      // esconde mapa/header/lista de técnicos e imprime só os KPIs +
      // atividade; "salvar como PDF" na caixa de impressão do navegador
      // resolve o "exportar" sem dependência nenhuma.
      document.getElementById('btn-imprimir').addEventListener('click', () => window.print());

      // ─── Modo TV: foca automaticamente em cada técnico ao vivo ──────
      // Pedido de 2026-09-04: pensado pra tela fixa na parede, sem
      // ninguém mexendo o mouse -- alterna sozinho pra cada técnico em
      // atendimento, dando um "tour" da operação.
      window._modoTvAtivo = false;
      let _modoTvIndice = 0;
      let _modoTvTimer = null;
      let _modoTvAlvos = [];
      function atualizarAlvosModoTv(aoVivo) { _modoTvAlvos = aoVivo; }
      function passoModoTv() {
        if (!_modoTvAlvos.length || !mapa) return;
        _modoTvIndice = (_modoTvIndice + 1) % _modoTvAlvos.length;
        const t = _modoTvAlvos[_modoTvIndice];
        const m = marcadores[t.tecnico_id];
        if (m) { mapa.setView(m.getLatLng(), 15); m.openPopup(); }
        selecionadoId = t.tecnico_id;
        renderizarLista(_ultimosTecnicos, _ultimoKm);
      }
      document.getElementById('btn-modo-tv').addEventListener('click', () => {
        const btn = document.getElementById('btn-modo-tv');
        window._modoTvAtivo = !window._modoTvAtivo;
        btn.classList.toggle('ativo', window._modoTvAtivo);
        if (window._modoTvAtivo) {
          btn.textContent = '📺 Modo TV (ativo)';
          _modoTvIndice = -1;
          passoModoTv();
          _modoTvTimer = setInterval(passoModoTv, 8000);
        } else {
          btn.textContent = '📺 Modo TV';
          clearInterval(_modoTvTimer);
        }
      });

      // ─── Painel de foco: rota do dia de um técnico + replay ─────────
      // Pedido de 2026-09-04: clicar num técnico e ver TUDO que ele fez
      // hoje, não só o ponto onde está agora.
      let _marcadorReplay = null;
      let _replayTimer = null;
      async function abrirPainelFoco(tecnicoId) {
        const painel = document.getElementById('painel-foco');
        const corpo = document.getElementById('foco-corpo');
        const t = _ultimosTecnicos.find(x => x.tecnico_id === tecnicoId);
        document.getElementById('foco-nome').textContent = t ? t.nome : 'Técnico';
        painel.classList.add('aberto');
        corpo.innerHTML = '<div class="vazio">Carregando rota do dia...</div>';

        try {
          const fichas = await fetch(`/api/fichas?tecnico_id=${tecnicoId}`, { cache: 'no-store' }).then(r => r.json());
          const hojeISO = new Date().toISOString().slice(0, 10);
          const fichaHoje = (Array.isArray(fichas) ? fichas : []).find(f => f.data_referencia === hojeISO);
          if (!fichaHoje) {
            corpo.innerHTML = '<div class="vazio">Sem ficha de hoje pra esse técnico.</div>';
            return;
          }
          const detalhe = await fetch(`/api/fichas/${fichaHoje.id}`, { cache: 'no-store' }).then(r => r.json());
          const servicos = detalhe.servicos || [];
          corpo.innerHTML = (servicos.length
            ? servicos.map(s => `
                <div class="foco-atendimento">
                  <b>${esc(s.cliente || 'Cliente sem nome')}</b>
                  <div class="foco-meta">${esc(s.status === 'concluido' ? '✓ concluído' : 'pendente')}
                    ${s.tipo_aparelho ? ' · ' + esc(s.tipo_aparelho) : ''}</div>
                </div>`).join('')
            : '<div class="vazio">Nenhum atendimento na ficha de hoje.</div>')
            + `<button type="button" class="btn-replay" id="btn-replay-agora">▶ Replay do trajeto de hoje</button>`;

          document.getElementById('btn-replay-agora').addEventListener('click', () => iniciarReplay(tecnicoId));
        } catch (e) {
          corpo.innerHTML = `<div class="vazio">Falha ao carregar: ${esc(e.message)}</div>`;
        }
      }
      document.getElementById('foco-fechar').addEventListener('click', () => {
        document.getElementById('painel-foco').classList.remove('aberto');
        pararReplay();
      });

      function pararReplay() {
        if (_replayTimer) { clearInterval(_replayTimer); _replayTimer = null; }
        if (_marcadorReplay) { mapa.removeLayer(_marcadorReplay); _marcadorReplay = null; }
      }

      async function iniciarReplay(tecnicoId) {
        const btn = document.getElementById('btn-replay-agora');
        pararReplay();
        btn.disabled = true;
        btn.textContent = 'Carregando trajeto...';
        try {
          const r = await fetch(`/api/tecnicos/${tecnicoId}/trajeto-hoje`, { cache: 'no-store' }).then(r => r.json());
          const pontos = r.pontos || [];
          if (pontos.length < 2) {
            btn.textContent = 'Sem trajeto suficiente hoje ainda';
            return;
          }
          btn.textContent = '⏸ Reproduzindo...';
          _marcadorReplay = L.circleMarker([pontos[0].lat, pontos[0].lng], {
            radius: 9, color: '#fff', weight: 2, fillColor: '#22d3ee', fillOpacity: 1,
          }).addTo(mapa);
          mapa.setView([pontos[0].lat, pontos[0].lng], 14);

          // Comprime o dia inteiro em ~20s de animação, não em tempo real
          // (um dia de trabalho levaria horas pra "assistir").
          let i = 0;
          const passoMs = Math.max(60, Math.floor(20000 / pontos.length));
          _replayTimer = setInterval(() => {
            i++;
            if (i >= pontos.length) { pararReplay(); btn.disabled = false; btn.textContent = '▶ Replay do trajeto de hoje'; return; }
            _marcadorReplay.setLatLng([pontos[i].lat, pontos[i].lng]);
            mapa.panTo([pontos[i].lat, pontos[i].lng], { animate: true, duration: .3 });
          }, passoMs);
        } catch (e) {
          btn.textContent = 'Falha ao carregar trajeto';
        } finally {
          setTimeout(() => { btn.disabled = false; }, 500);
        }
      }

      relogio();
      atualizar();
      setInterval(atualizar, INTERVALO);
    })();
  </script>
</body>
