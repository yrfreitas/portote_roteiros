<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiqueta OS #{{ '%06d' % ordem.id }} · Porto Tec</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
  /* Etiqueta pra colar no aparelho na entrada — pedido de 2026-08-31.
     Tamanho de cartão (90mm x 50mm, como um cartão de visita) em vez de
     A4 inteira: o objetivo é cortar e colar, não arquivar. */
  :root { --tinta: #1b1e24; --tinta-2: #4b5563; --linha: #d8dde5; --azul: #1d5fae; }
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f5f7; color: var(--tinta);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif;
  }
  .pagina { max-width: 760px; margin: 16px auto; padding: 0 16px; }
  .instrucao {
    font-size: 12px; color: var(--tinta-2); margin-bottom: 14px;
  }
  .etiqueta {
    width: 90mm; height: 50mm; border: 1.5px dashed var(--linha);
    border-radius: 4px; padding: 4mm; display: flex; gap: 3mm;
    align-items: center; background: #fff;
  }
  .etiqueta-qr { width: 34mm; height: 34mm; flex-shrink: 0; }
  .etiqueta-qr img { width: 100%; height: 100%; }
  .etiqueta-info { min-width: 0; }
  .etiqueta-numero { font-size: 20px; font-weight: 800; color: var(--azul); line-height: 1.1; }
  .etiqueta-cliente { font-size: 12px; font-weight: 700; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etiqueta-aparelho { font-size: 10.5px; color: var(--tinta-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etiqueta-defeito { font-size: 9.5px; color: var(--tinta-2); margin-top: 4px; max-height: 24px; overflow: hidden; }
  @media print {
    body { background: #fff; }
    .instrucao, .botao-imprimir { display: none; }
    .etiqueta { border-style: solid; }
  }
  .botao-imprimir {
    margin-top: 16px; padding: 8px 16px; border-radius: 8px; border: none;
    background: var(--azul); color: #fff; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="pagina">
    <p class="instrucao">Corte na linha pontilhada e cole no aparelho. Escaneando o QR (já logado) abre a OS direto.</p>
    <div class="etiqueta">
      <div class="etiqueta-qr"><img src="{{ qr_data_uri }}" alt="QR Code"></div>
      <div class="etiqueta-info">
        <div class="etiqueta-numero">OS #{{ '%06d' % ordem.id }}</div>
        <div class="etiqueta-cliente">{{ ordem.cliente_nome }}</div>
        <div class="etiqueta-aparelho">{{ [ordem.tipo_aparelho, ordem.marca, ordem.modelo] | select | join(' · ') }}</div>
        {% if ordem.defeito_declarado %}
        <div class="etiqueta-defeito">{{ ordem.defeito_declarado }}</div>
        {% endif %}
      </div>
    </div>
    <button class="botao-imprimir" onclick="window.print()">Imprimir</button>
  </div>
</body>
</html>
