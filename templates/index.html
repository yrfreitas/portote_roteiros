<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Sistema de roteirização de atendimentos técnicos — Porto Tec">
  <title>Portotec — Roteiros</title>

  <!-- PWA: instalável na tela inicial, abre em tela cheia -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#060911">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roteiros">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap">

  <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="layout">

  <header>
    <img src="/static/logo.png" alt="Porto Tec"
         style="height:42px;width:auto;object-fit:contain;">

    <nav class="main-tabs" id="main-tabs">
      <button class="main-tab active" id="mtab-roteiros" onclick="switchMainTab('roteiros')">
        <svg class="icone-svg icone-13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        Roteiros
      </button>
      <button class="main-tab" id="mtab-cep" onclick="switchMainTab('cep')">
        <svg class="icone-svg icone-13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Verificar CEP
      </button>
    </nav>

    <div class="header-meta">
      <span class="header-date" id="current-date"></span>
      <div class="status-pill" id="status-pill" title="Verificando conexão...">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-texto">conectando</span>
        <span id="status-latencia" class="status-latencia"></span>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="panel-roteiros-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Técnicos</span>
      <button class="btn-nova-ficha" onclick="abrirModalNovoTecnico()"
              title="Novo técnico" aria-label="Adicionar técnico">+</button>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="loading-row">Carregando...</div>
    </div>
  </aside>

  <main class="main" id="panel-roteiros-main">

    <div class="empty-state" id="empty-state">
      <div class="visao-geral hud-frame" id="visao-geral">
        <div class="visao-geral-header">
          <span class="visao-geral-title">Visão Geral</span>
          <span class="visao-geral-live"><span class="status-dot"></span>ao vivo</span>
        </div>
        <div class="visao-geral-stats">
          <div class="vg-stat">
            <div class="vg-valor" id="vg-tecnicos">0</div>
            <div class="vg-label">Técnicos</div>
          </div>
          <div class="vg-stat">
            <div class="vg-valor" id="vg-rotas">0</div>
            <div class="vg-label">Rotas Ativas</div>
          </div>
          <div class="vg-stat">
            <div class="vg-valor" id="vg-pontos">0</div>
            <div class="vg-label">Pontos de Serviço</div>
          </div>
          <div class="vg-stat">
            <div class="vg-valor" id="vg-km">0</div>
            <div class="vg-label">Km Planejados</div>
          </div>
        </div>
        <div class="visao-geral-tecnicos" id="visao-geral-tecnicos"></div>
      </div>

      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="60" height="60"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </div>
      <h2>Nenhuma ficha selecionada</h2>
      <p>Selecione um técnico e abra uma ficha de dia para ver o roteiro.</p>
      <button class="btn btn-primary" onclick="abrirModalNovoTecnico()">+ Novo Técnico</button>
    </div>

    <div id="ficha-detail" style="display:none;"></div>

  </main>

  <main class="main" id="panel-cep" style="display:none; grid-row: 2; grid-column: 1 / -1;">
    <div class="verificador-box verificador-box--full">
      <div class="verificador-title-row">
        <div class="verificador-title">Verificar Encaixe</div>
        <button type="button" class="vbusca-modo-link" id="btn-modo-busca" onclick="alternarModoBusca()">
          Buscar por endereço
        </button>
      </div>

      <div class="verificador-row" id="linha-busca-cep">
        <label for="verificar-cep-input" style="position:absolute;left:-9999px;">CEP a verificar</label>
        <input type="text" class="form-input" id="verificar-cep-input"
               placeholder="00000-000" maxlength="9"
               inputmode="numeric" autocomplete="postal-code"
               oninput="formatarCEP(this)"
               onkeydown="if(event.key==='Enter') verificarCEP()">
        <button class="btn btn-primary" onclick="verificarCEP()" id="btn-verificar">Verificar</button>
      </div>

      <div class="verificador-row" id="linha-busca-endereco" style="display:none;">
        <label for="verificar-endereco-input" style="position:absolute;left:-9999px;">Endereço a verificar</label>
        <input type="text" class="form-input" id="verificar-endereco-input"
               placeholder="Rua, número, bairro, cidade..."
               onkeydown="if(event.key==='Enter') verificarEndereco()">
        <button class="btn btn-primary" onclick="verificarEndereco()" id="btn-verificar-endereco">Verificar</button>
      </div>

      <div class="vcep-historico" id="vcep-historico"></div>

      <button type="button" class="vcep-comparar-toggle" id="btn-comparar-toggle" onclick="alternarComparar()">
        Comparar com outro CEP
      </button>
      <div class="verificador-row" id="linha-comparar" style="display:none;">
        <label for="verificar-cep-input-b" style="position:absolute;left:-9999px;">Segundo CEP a comparar</label>
        <input type="text" class="form-input" id="verificar-cep-input-b"
               placeholder="00000-000 (comparar)" maxlength="9"
               inputmode="numeric" oninput="formatarCEP(this)"
               onkeydown="if(event.key==='Enter') verificarComparar()">
        <button class="btn btn-ghost" onclick="verificarComparar()">Comparar</button>
      </div>

      <div id="verificar-resultado"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-novo-tecnico" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-title">Novo Técnico</div>
    <div class="form-group">
      <label class="form-label" for="novo-tecnico-nome">Nome do Técnico</label>
      <input type="text" class="form-input" id="novo-tecnico-nome"
             maxlength="80" placeholder="Ex: Pedro, Cristian..."
             onkeydown="if(event.key==='Enter') criarTecnico()">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="criarTecnico()">Criar Técnico</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-nova-ficha" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-title">Nova Ficha de Dia</div>
    <input type="hidden" id="nova-ficha-tecnico-id">

    <div class="form-group">
      <label class="form-label">Dia da Semana</label>
      <div class="dias-grid">
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Segunda-feira')">SEG</button>
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Terça-feira')">TER</button>
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Quarta-feira')">QUA</button>
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Quinta-feira')">QUI</button>
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Sexta-feira')">SEX</button>
        <button type="button" class="dia-pill" onclick="selecionarDia(this, 'Sábado')">SAB</button>
      </div>
      <input type="hidden" id="nova-dia">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="nova-data">Data (opcional)</label>
        <input type="date" class="form-input" id="nova-data">
      </div>
      <div class="form-group">
        <label class="form-label" for="nova-partida-cep">CEP de Partida</label>
        <input type="text" class="form-input" id="nova-partida-cep"
               placeholder="01310-100" maxlength="9"
               inputmode="numeric" oninput="formatarCEP(this)">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="nova-partida-nome">Nome do Ponto de Partida</label>
      <input type="text" class="form-input" id="nova-partida-nome"
             placeholder="Ex: Portotec — Sede Central">
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="criarFicha()">Criar Ficha</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-add-servico" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-title">Adicionar Ponto de Serviço</div>
    <input type="hidden" id="add-ficha-id">

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="add-cep">CEP *</label>
        <input type="text" class="form-input" id="add-cep"
               placeholder="01310-100" maxlength="9"
               inputmode="numeric" oninput="formatarCEP(this)">
      </div>
      <div class="form-group">
        <label class="form-label" for="add-numero">Número</label>
        <input type="text" class="form-input" id="add-numero"
               placeholder="Ex: 42 ou Apto 3">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="add-cliente">Cliente</label>
      <input type="text" class="form-input" id="add-cliente"
             placeholder="Nome do cliente">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="add-tipo-aparelho">Tipo de Aparelho</label>
        <select class="form-input" id="add-tipo-aparelho">
          <option value="">Selecione...</option>
          <option>Geladeira</option>
          <option>Freezer</option>
          <option>Máquina de Lavar</option>
          <option>Lava e Seca</option>
          <option>Fogão</option>
          <option>Micro-ondas</option>
          <option>Purificador</option>
          <option>Side by Side</option>
          <option>Câmara Fria</option>
          <option>Expositora</option>
          <option>Secadora</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="add-modelo">Modelo</label>
        <input type="text" class="form-input" id="add-modelo"
               placeholder="Ex: BRM45, CRP36...">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="add-descricao">Descrição do Serviço</label>
      <input type="text" class="form-input" id="add-descricao"
             placeholder="Ex: Máquina não centrifuga, não gela..."
             onkeydown="if(event.key==='Enter') adicionarServico()">
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btn-add-servico" onclick="adicionarServico()">
        Adicionar + Otimizar
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
